<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni-Claw Trace Dashboard</title>
<style>
:root {
  --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --dim:#8b949e;
  --green:#3fb950; --red:#f85149; --amber:#d2991d; --cyan:#58a6ff; --violet:#a371f7;
  --green-bg:#3fb95015; --red-bg:#f8514915; --cyan-bg:#58a6ff10;
  font:13px/1.5 'SF Mono','JetBrains Mono','Menlo',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);display:flex;height:100vh}
a{color:var(--cyan)}

/* Sidebar */
#sidebar{width:300px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar h2{padding:16px 16px 8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
#trace-list{flex:1;overflow-y:auto;padding:0 8px}
.trace-group{margin-bottom:12px}
.trace-group-header{font-weight:600;font-size:13px;padding:4px 4px 2px;color:var(--text)}
.trace-group-meta{font-size:10px;color:var(--dim);padding:0 4px 4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.trace-item{padding:10px 12px;margin:2px 0;cursor:pointer;border-radius:6px;transition:background .15s}
.trace-item:hover{background:var(--cyan-bg)}
.trace-item.active{background:var(--cyan-bg);border:1px solid #58a6ff40}
.trace-sub{padding:6px 12px 6px 24px;font-size:11px}
.trace-name{font-weight:600;font-size:12px;margin-bottom:2px}
.trace-meta{font-size:10px;color:var(--dim);display:flex;gap:12px}
.trace-meta .pass{color:var(--green)} .trace-meta .fail{color:var(--red)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#header h1{font-size:14px;font-weight:600}
.tabs{display:flex;gap:4px}
.tab-btn{padding:6px 14px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;border-radius:4px;font-size:11px;transition:all .15s}
.tab-btn:hover{color:var(--text);border-color:var(--dim)}
.tab-btn.active{background:var(--cyan-bg);color:var(--cyan);border-color:var(--cyan)}

/* Session card */
#session-card{margin:16px 20px 0;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;gap:24px;flex-wrap:wrap;font-size:11px}
.session-field{display:flex;flex-direction:column;gap:2px}
.session-field .label{color:var(--dim);font-size:10px;text-transform:uppercase}
.session-field .value{font-weight:600;font-size:13px}
.session-field .value.pass{color:var(--green)}.session-field .value.warn{color:var(--amber)}

/* Content */
#content{flex:1;overflow-y:auto;padding:16px 20px}
.loading{color:var(--dim);padding:60px 0;text-align:center;font-size:12px}

/* Tree */
.tree{font-size:12px;line-height:2}
.tree-line{padding-left:4px;white-space:nowrap}
.tree-line:hover{background:var(--cyan-bg)}
.tree-toggle{color:var(--dim);cursor:pointer;margin-right:4px;font-size:10px;width:12px;display:inline-block;text-align:center;user-select:none}
.tree-name{font-weight:600}
.tree-name.root{color:var(--amber)}
.tree-name.container{color:var(--cyan)}
.tree-name.leaf{color:var(--text)}

.action-tag{display:inline-block;margin:0 4px;padding:0 6px;border-radius:3px;font-size:10px;line-height:1.6}
.action-tag.click{background:var(--cyan-bg);color:var(--cyan)}
.action-tag.toggle{background:#a371f720;color:var(--violet)}
.action-tag.fail{text-decoration:line-through;opacity:.7}
.action-tag.skip{color:var(--dim);border:1px dashed var(--border)}

/* State flow */
.flow-row{padding:4px 0;font-size:12px}
.flow-from{color:var(--violet)}.flow-arrow{color:var(--dim);margin:0 8px}.flow-to{color:var(--cyan)}

/* Actions table */
.act-table{width:100%;border-collapse:collapse;font-size:11px}
.act-table th{text-align:left;padding:6px 8px;color:var(--dim);border-bottom:1px solid var(--border);font-weight:400}
.act-table td{padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}

/* Coverage bars */
.cov-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.cov-bar .bar{height:18px;background:var(--cyan);border-radius:3px;min-width:2px;transition:width .3s}
.cov-bar .label{font-size:11px;color:var(--dim);min-width:100px}

/* Metric cards */
.metrics-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.metric-card{flex:1;min-width:100px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;text-align:center}
.metric-card .num{font-size:22px;font-weight:700;line-height:1.2}
.metric-card .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:4px}
.metric-card .num.g{color:var(--green)}.metric-card .num.r{color:var(--red)}.metric-card .num.a{color:var(--amber)}.metric-card .num.c{color:var(--cyan)}.metric-card .num.v{color:var(--violet)}</style>
</head>
<body>

<div id="sidebar">
  <h2>Traces</h2>
  <div id="trace-list"><div class="loading">Loading...</div></div>
</div>

<div id="main">
  <div id="header">
    <h1 id="page-title">Trace Dashboard</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tree')">Operation Tree</button>
      <button class="tab-btn" onclick="switchTab('state')">State Flow</button>
      <button class="tab-btn" onclick="switchTab('actions')">Action Log</button>
      <button class="tab-btn" onclick="switchTab('ai')">AI Calls</button>
      <button class="tab-btn" onclick="switchTab('coverage')">Coverage</button>
      <button class="tab-btn" onclick="switchTab('perf')">Performance</button>
    </div>
  </div>
  <div id="session-card" style="display:none"></div>
  <div id="content"><div class="loading">Select a trace from the sidebar</div></div>
</div>

<script>
let currentTrace=null, currentTab='tree';

let allTraces=[];

async function loadTraces(){
  const r=await fetch('/api/traces');
  const d=await r.json();
  const list=document.getElementById('trace-list');
  if(!d.traces||!d.traces.length){list.innerHTML='<div class="loading">No traces</div>';return}
  allTraces=d.traces;

  // Group by plan_name
  const groups={};
  for(const t of allTraces){
    const session=t.session||{};
    const cfg=session.config||{};
    const name=cfg.plan_name||cfg.test_name||t.trace_id.substring(0,12);
    if(!groups[name])groups[name]={name,traces:[]};
    groups[name].traces.push(t);
  }

  list.innerHTML=Object.values(groups).map(g=>{
    const tracesHTML=g.traces.map(t=>{
      const session=t.session||{};
      const ok=session.status==='completed';
      const ts=new Date((session.start_time||0)*1000).toLocaleTimeString();
      const steps=session.config?.expected_steps||'?';
      return`<div class="trace-item trace-sub" data-tid="${t.trace_id}" onclick="selectTrace('${t.trace_id}');event.stopPropagation()">
        <div class="trace-name">${ts} <span class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${session.status||'?'}</span></div>
        <div class="trace-meta">${t.node_count||0} nodes · exp ${steps} steps</div>
      </div>`;
    }).join('');

    return`<div class="trace-group">
      <div class="trace-group-header">${g.name}</div>
      ${tracesHTML}
    </div>`;
  }).join('');
}

async function selectTrace(tid){
  currentTrace=tid;
  document.querySelectorAll('.trace-item').forEach(e=>e.classList.remove('active'));
  document.querySelector(`.trace-item[data-tid="${tid}"]`)?.classList.add('active');
  await renderAll();
}

async function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  await renderContent();
}

async function renderAll(){
  if(!currentTrace)return;
  // Session card
  const card=document.getElementById('session-card');
  const ar=await fetch(`/api/analysis?id=${currentTrace}`);
  const ad=await ar.json();
  const session=ad.session||{};
  const cfg=session.config||{};
  card.style.display='flex';
  // Get actual steps from analysis
  let actualSteps='?', actualNodes='?';
  try{
    const tr=await fetch(`/api/operation-tree?id=${currentTrace}`);
    const td=await tr.json();
    actualSteps=td.stats?.total_steps||'?';
    actualNodes=td.stats?.total_actions||'?';
  }catch(e){}

  card.innerHTML=`
    <div class="session-field"><span class="label">Test</span><span class="value">${cfg.test_name||'—'}</span></div>
    <div class="session-field"><span class="label">Scenario</span><span class="value">${cfg.test_scenario||'—'}</span></div>
    <div class="session-field"><span class="label">Status</span><span class="value ${session.status==='completed'?'pass':'warn'}">${session.status||'?'}</span></div>
    ${cfg.expected_status?`<div class="session-field"><span class="label">Expected</span><span class="value">${cfg.expected_status}</span></div>`:''}
    ${cfg.expected_steps?`<div class="session-field"><span class="label">Steps</span><span class="value ${actualSteps==cfg.expected_steps?'pass':'warn'}">${actualSteps} / ${cfg.expected_steps} expected</span></div>`:''}
    ${cfg.expected_nodes?`<div class="session-field"><span class="label">Nodes</span><span class="value">${actualNodes} actions</span></div>`:''}
  `;
  document.getElementById('page-title').textContent=cfg.test_name||'Trace Dashboard';

  await renderContent();
}

async function renderContent(){
  if(!currentTrace)return;
  const content=document.getElementById('content');
  content.innerHTML='<div class="loading">Loading...</div>';

  // Always show metrics cards
  let metricsHTML='';
  try{
    const ar=await fetch(`/api/analysis?id=${currentTrace}`);
    const d=await ar.json();
    const perf=d.performance||{};
    const cov=d.coverage||{};
    const ai=d.ai_calls||[];
    const errors=d.error_stats||{};

    if(d.stats){d.stats=d.stats}
    metricsHTML=`<div class="metrics-row">
      <div class="metric-card"><div class="num c">${d.page_tree?.total_pages||0}</div><div class="lbl">Pages</div></div>
      <div class="metric-card"><div class="num v">${d.state_sequence?.length||0}</div><div class="lbl">Transitions</div></div>
      <div class="metric-card"><div class="num a">${ai.length}</div><div class="lbl">AI Calls</div></div>
      <div class="metric-card"><div class="num c">${perf.avg_latency_ms?Math.round(perf.avg_latency_ms)+'ms':'—'}</div><div class="lbl">Avg Latency</div></div>
      <div class="metric-card"><div class="num ${(errors.total||0)?'r':'g'}">${errors.total||0}</div><div class="lbl">Errors</div></div>
      <div class="metric-card"><div class="num g">${cov.visit_percent||0}%</div><div class="lbl">Coverage</div></div>
    </div>`;
  }catch(e){}

  if(currentTab==='tree'){
    const r=await fetch(`/api/operation-tree?id=${currentTrace}`);
    const data=await r.json();
    content.innerHTML=data.tree?.length
      ?`<div class="tree">${data.tree.map(n=>renderTree(n,0)).join('')}</div>`
      :'<div class="loading">No tree data</div>';
  }else if(currentTab==='state'){
    const ar=await fetch(`/api/analysis?id=${currentTrace}`);
    const d=await ar.json();
    const states=d.state_sequence||[];

    // Group by parent_span_id
    const byParent={};
    for(const s of states){
      const pid=s.parent_span_id||'root';
      if(!byParent[pid])byParent[pid]=[];
      byParent[pid].push(s);
    }

    // Get step names from operation tree span_ids
    const or=await fetch(`/api/operation-tree?id=${currentTrace}`);
    const od=await or.json();

    // Build span_id → name map from steps in analysis
    const stepNames={'root':'initialize'};

    // Show: root group first, then step groups in order
    let html='<div class="tree">';
    const roots=byParent['root']||[];
    if(roots.length){
      html+=`<div class="tree-line"><span style="color:var(--amber);font-weight:600">▸ initialize</span> <span style="color:var(--dim);font-size:10px">${roots.length} tx</span></div>`;
      for(const t of roots){
        html+=`<div class="flow-row" style="margin-left:20px"><span style="color:var(--violet);font-size:10px">${t.from_state||'?'}</span><span style="color:var(--dim);margin:0 6px;font-size:10px">→</span><span style="color:var(--cyan);font-size:10px">${t.to_state||'?'}</span></div>`;
      }
    }

    // Remaining groups — show in order
    let stepNum=0;
    const seen=new Set(['root']);
    for(const s of states){
      const pid=s.parent_span_id||'root';
      if(seen.has(pid))continue;
      seen.add(pid);
      const grp=byParent[pid]||[];
      if(!grp.length)continue;
      stepNum++;
      html+=`<div class="tree-line"><span style="color:var(--amber);font-weight:600">▸ step ${stepNum}</span> <span style="color:var(--dim);font-size:10px">${grp.length} tx${pid!=='root'?' · '+pid.substring(0,16):''}</span></div>`;
      for(const t of grp){
        html+=`<div class="flow-row" style="margin-left:20px"><span style="color:var(--violet);font-size:10px">${t.from_state||'?'}</span><span style="color:var(--dim);margin:0 6px;font-size:10px">→</span><span style="color:var(--cyan);font-size:10px">${t.to_state||'?'}</span></div>`;
      }
    }

    html+='</div>';
    content.innerHTML=html||'<div class="loading">No state data</div>';
  }else if(currentTab==='actions'){
    const ar=await fetch(`/api/analysis?id=${currentTrace}`);
    const d=await ar.json();
    const actions=(d.action_sequence||[]).filter(a=>
      a.action!=='entry_strategy'&&a.action!=='no_action'
    );

    const rows=actions.map(a=>{
      const ok=a.status==='success';
      const color=ok?'var(--green)':'var(--red)';
      const act=a.action||'?';
      const actColor=act==='back'?'var(--amber)':act==='click'?'var(--cyan)':'var(--dim)';
      const target=a.target||(act==='back'?'navigate back':'—');
      return`<tr>
        <td style="color:${color}">${ok?'✓':'✗'}</td>
        <td style="color:${actColor}">${act}</td>
        <td style="color:${ok?'var(--dim)':'var(--red)'}">${target}</td>
        <td style="color:var(--dim);font-size:10px">${a.duration_ms||''}</td>
      </tr>`;
    });

    // Count by type
    const counts={}; for(const a of actions){const t=a.action||'?';counts[t]=(counts[t]||0)+1}
    const summary=Object.entries(counts).map(([k,v])=>`${k}: ${v}`).join(' · ');

    content.innerHTML=`
      <div style="padding:8px 0;color:var(--dim);font-size:11px">${summary} (total: ${actions.length})</div>
      <div style="max-height:200px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--border);border-radius:4px">
        <div style="padding:6px 10px;font-size:10px;color:var(--dim)">Skip / no-match items are shown in the <b>Operation Tree</b> tab as <span style="color:var(--red)">✗ click</span> on menu items without fixture pages.</div>
      </div>
      <table class="act-table">
        <tr><th>Status</th><th>Action</th><th>Target</th><th>ms</th></tr>
        ${rows.join('')}
      </table>`;
  }else if(currentTab==='ai'){
    const ar=await fetch(`/api/analysis?id=${currentTrace}`);
    const d=await ar.json();
    const calls=d.ai_calls||[];
    content.innerHTML=`<table class="act-table">
      <tr><th>Time</th><th>Provider</th><th>Latency</th><th>Tokens In</th><th>Tokens Out</th><th>Page</th></tr>
      ${calls.map(c=>`<tr>
        <td style="color:var(--dim)">${new Date(c.timestamp*1000).toLocaleTimeString()}</td>
        <td>${c.provider_id||'—'}</td>
        <td style="color:var(--amber)">${c.latency_ms||0}ms</td>
        <td>${c.input_tokens||'—'}</td><td>${c.output_tokens||'—'}</td>
        <td style="color:var(--dim)">${c.page_id||'—'}</td>
      </tr>`).join('')}
    </table>`;
  }else if(currentTab==='coverage'){
    const ar=await fetch(`/api/analysis?id=${currentTrace}`);
    const d=await ar.json();
    const cov=d.coverage||{};
    const visits=cov.page_visits||{};
    const maxV=Math.max(...Object.values(visits),1);
    content.innerHTML='<div>' + Object.entries(visits).sort((a,b)=>b[1]-a[1]).map(([page,count])=>
      `<div class="cov-bar"><span class="label">${page}</span><span class="bar" style="width:${(count/maxV)*300}px"></span><span style="font-size:11px;color:var(--dim)">${count} visits</span></div>`
    ).join('') + '</div>';
  }else if(currentTab==='perf'){
    const ar=await fetch(`/api/performance?id=${currentTrace}`);
    const d=await ar.json();
    const p=d.performance||d;
    content.innerHTML=`<div class="metrics-row">
      <div class="metric-card"><div class="num a">${p.avg_latency_ms?Math.round(p.avg_latency_ms)+'ms':'—'}</div><div class="lbl">Avg Latency</div></div>
      <div class="metric-card"><div class="num a">${p.p50_latency_ms?Math.round(p.p50_latency_ms)+'ms':'—'}</div><div class="lbl">P50 Latency</div></div>
      <div class="metric-card"><div class="num a">${p.p95_latency_ms?Math.round(p.p95_latency_ms)+'ms':'—'}</div><div class="lbl">P95 Latency</div></div>
      <div class="metric-card"><div class="num">${p.avg_tokens_in?Math.round(p.avg_tokens_in):'—'}</div><div class="lbl">Avg Tokens In</div></div>
      <div class="metric-card"><div class="num">${p.avg_tokens_out?Math.round(p.avg_tokens_out):'—'}</div><div class="lbl">Avg Tokens Out</div></div>
      <div class="metric-card"><div class="num">${p.total_calls||0}</div><div class="lbl">Total Calls</div></div>
    </div>`;
  }
  content.innerHTML=metricsHTML + content.innerHTML;
}

function treeLines(depth,isLast){
  let s='';
  for(let i=0;i<depth;i++)s+=`<span style="color:var(--border)">${i===depth-1?(isLast?'└':'├'):'│'}  </span>`;
  return s;
}

function iconFor(node){
  if(!node.children||!node.children.length)return node.name==='root'?'◆':'·';
  return '<span class="tree-toggle" onclick="toggleKids(this)">▶</span>';
}

function renderTree(node,depth,isLast){
  const hasKids=node.children&&node.children.length>0;
  const prefix=treeLines(depth-1,isLast)+(depth>0?'':'');
  const lines=treeLines(depth,false).replace(/[│├└]/g,'');

  let cls='leaf';
  if(node.name==='root')cls='root';
  else if(hasKids)cls='container';

  let html=`<div class="tree-line">${prefix}${depth>0?(isLast?'└─ ':'├─ '):''}${hasKids?`<span class="tree-toggle" onclick="toggleKids(this,event)">▶</span> `:''}<span class="tree-name ${cls}">${node.name}</span>`;

  for(const a of(node.actions||[])){
    const act=a.action==='click'?'click':'toggle';
    const ok=a.status==='success';
    html+=`<span class="action-tag ${act} ${ok?'':'fail'}">${ok?'✔':'✗'} ${a.action}${a.target?': '+a.target:''}</span>`;
  }
  html+='</div>';

  if(hasKids){
    const kidId='k_'+node.node_id?.replace(/[^a-zA-Z0-9]/g,'_');
    html+=`<div id="${kidId}" class="tree-children" style="display:${depth===0?'block':'none'}">`;
    html+=node.children.map((c,i)=>renderTree(c,depth+1,i===node.children.length-1)).join('');
    html+='</div>';
  }
  return html;
}

function toggleKids(btn,ev){
  if(ev)ev.stopPropagation();
  const el=btn.parentElement.nextElementSibling;
  if(!el)return;
  const show=el.style.display==='none';
  el.style.display=show?'block':'none';
  btn.textContent=show?'▼':'▶';
}

loadTraces();
</script>
</body>
</html>
