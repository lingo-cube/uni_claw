# MCP Provider Configuration - Portable Setup
# This configuration works on any machine with ANTHROPIC_API_KEY set

version: 1.0

providers:
  mcp:
    class: "MCPProvider"
    config:
      # API key will be loaded from ANTHROPIC_API_KEY environment variable
      # You can also hardcode here for testing (NOT recommended for production)
      api_key: "${ANTHROPIC_API_KEY}"

      # Model to use for vision analysis
      model: "claude-3-5-sonnet-20241022"

      # Base URL - uses official API by default
      # Set ANTHROPIC_BASE_URL env var to use proxy/custom endpoint
      base_url: "https://api.anthropic.com"

      # Connection settings
      max_concurrent_requests: 4
      request_timeout: 60.0

    capabilities:
      - analyze_visual

    performance:
      latency: 0.7
      quality: 0.95
      efficiency: 0.8

# Routing
routing:
  analyze_visual: claude  # Use claude by default, change to mcp if preferred
