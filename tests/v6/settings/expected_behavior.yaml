target_search_baseline:
  date: "2026-06-08"
  version: "V6.11.1"
  test: "test_target_search_stops_at_dark_mode"
  completion_policy: "TARGET_FOUND: Dark mode (EXACT, MARK_AND_STOP)"
  status: "GlobalState.COMPLETED"
  steps: 49
  visited_nodes: 9
  execution_time: "< 2s"

  visited_pages:
    depth_first_order:
      - "设置主页 (root)"
      - "Wi-Fi (menu_container-Wi-Fi-0-root)"
      - "Bluetooth (menu_container-Bluetooth-1-root)"
      - "Display (menu_container-Display-2-root)"
    target:
      - "Dark mode (switch_leaf-Dark mode-2-menu_container-Display-2-root)"
    not_visited:
      - "Storage"     # 排在 Display 之后，不应访问
      - "Battery"     # 同上
      - "Apps"        # 同上

  behavior:
    - "深度优先：Wi-Fi 子树完成 → Bluetooth 子树完成 → Display 子树中命中目标"
    - "提前终止：Storage/Battery/Apps 未被访问"
    - "二级菜单无 fixture 页的项（HomeNetwork 等）失败回退，不阻塞"
