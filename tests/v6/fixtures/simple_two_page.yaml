# Simple two-page fixture for simulation testing.
# Demonstrates a basic home -> detail navigation pattern.

pages:
  home:
    page_name: "HomeScreen"
    elements:
      - id: "btn_settings"
        type: "button"
        text: "Settings"
        coordinate: {x: 0.5, y: 0.9}
        action_target: "settings"

      - id: "btn_detail"
        type: "button"
        text: "View Details"
        coordinate: {x: 0.5, y: 0.5}
        action_target: "detail"

      - id: "switch_feature"
        type: "switch"
        text: "Enable Feature"
        coordinate: {x: 0.7, y: 0.3}

    is_complete: false

  detail:
    page_name: "DetailScreen"
    elements:
      - id: "btn_back"
        type: "back_button"
        text: "Back"
        coordinate: {x: 0.1, y: 0.1}

      - id: "btn_settings"
        type: "button"
        text: "Settings"
        coordinate: {x: 0.5, y: 0.9}
        action_target: "settings"

      - id: "text_content"
        type: "text"
        text: "Detail Content"
        coordinate: {x: 0.5, y: 0.5}

    is_complete: false

  settings:
    page_name: "SettingsScreen"
    elements:
      - id: "btn_back"
        type: "back_button"
        text: "Back"
        coordinate: {x: 0.1, y: 0.1}

      - id: "switch_notifications"
        type: "switch"
        text: "Notifications"
        coordinate: {x: 0.5, y: 0.3}

      - id: "switch_dark_mode"
        type: "switch"
        text: "Dark Mode"
        coordinate: {x: 0.5, y: 0.5}

    is_complete: true

transitions:
  home_to_detail:
    trigger: "btn_detail"
    from_page: "home"
    to_page: "detail"
    action: "click"

  home_to_settings:
    trigger: "btn_settings"
    from_page: "home"
    to_page: "settings"
    action: "click"

  detail_to_settings:
    trigger: "btn_settings"
    from_page: "detail"
    to_page: "settings"
    action: "click"

  detail_back_home:
    trigger: "btn_back"
    from_page: "detail"
    to_page: "home"
    action: "click"

  settings_back_detail:
    trigger: "btn_back"
    from_page: "settings"
    to_page: "detail"
    action: "click"

initial_page: "home"
history_depth: 10
