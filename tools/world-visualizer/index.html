<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>World · 认识如何形成</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><a class="brand" href="./"><span class="brand-mark">W</span><strong>World<span>认识如何形成</span></strong></a><div class="top-note">UniClaw <span class="badge">只读观察台</span></div><label class="import-button">导入记录<input id="import" type="file" accept=".json,application/json"></label></header>
<main>
<section class="intro"><div><p class="eyebrow">WORLD EXPLORER / 01</p><h1>让每一次认识，都有来处。</h1><p class="muted">从观察到世界图，再到 Slice 与实际消费，沿着证据看清变化。</p></div><div class="dataset-picker"><label for="dataset">选择一段过程</label><select id="dataset"><option>正在读取资料…</option></select><span id="dataset-meta" class="small"></span></div></section>
<div id="error" role="alert" hidden></div>
<section class="boundary"><span class="dot"></span><strong id="input-class">真实核心 · 受控输入</strong><span id="boundary-text">正在读取来源…</span><button id="provenance">查看来源</button></section>
<section class="timeline panel" aria-label="版本时间线"><div class="timeline-head"><div><span class="eyebrow">选定时点</span><h2 id="event-title">读取中</h2></div><div class="timeline-controls"><button id="prev" aria-label="上一个时点">←</button><button id="play">▶ 播放</button><button id="next" aria-label="下一个时点">→</button><span id="position"></span></div></div><div class="scrubber"><input id="time" type="range" min="0" max="0" value="0" aria-label="选择时点"><select id="frame" aria-label="选择 World 修订"></select></div><div id="version-meta" class="version-meta"></div><div id="events" class="events"></div></section>
<div class="workspace">
<section class="panel graph-panel"><div class="panel-title"><div><p class="eyebrow">01 / 世界图</p><h2>关系与归属 <span id="graph-count"></span></h2></div><button id="reset">返回全图</button></div><div class="graph-tools"><input id="search" placeholder="查找页面或对象" aria-label="筛选图对象"><select id="relation-filter" aria-label="筛选关系"><option value="all">全部关系</option><option value="0">包含</option><option value="1">覆盖</option><option value="2">导航</option></select><label><input id="show-elements" type="checkbox" checked> 元素</label></div><div class="graph-canvas"><svg id="graph" viewBox="0 0 680 420" role="img" aria-label="World 关系图"></svg><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="focus">聚焦所选</button></div></div><div class="legend"><span>● 页面身份</span><span>◇ 当前观察对象</span><span>→ 有据关系</span><span>拖动平移 · 滚轮缩放</span></div><div id="graph-list" class="object-list" aria-label="图对象列表"></div></section>
<section class="panel page-panel"><div class="panel-title"><div><p class="eyebrow">02 / 页面与范围</p><h2 id="page-title">页面表达</h2></div><span class="badge">不可执行</span></div><div class="page-options"><label>页面<select id="container"></select></label><label>实际范围<select id="scope"></select></label></div><div class="mode-row"><button id="mode-current" aria-pressed="true">当时认识</button><button id="mode-latest" aria-pressed="false">更正后解释</button><button id="mode-content" aria-pressed="false">累计内容</button></div><div id="view-note" class="view-note"></div><div id="page-stage" class="page-stage"></div><div id="page-unknown" class="unknown"></div><div id="semantic-cards" class="semantic-cards"></div></section>
</div>
<section class="panel detail-panel"><div class="detail-tabs" role="tablist" aria-label="查看详情"><button role="tab" id="tab-inspect" aria-selected="true" data-tab="inspect">对象与来源</button><button role="tab" id="tab-compare" aria-selected="false" data-tab="compare">版本变化 <span id="diff-count"></span></button><button role="tab" id="tab-flow" aria-selected="false" data-tab="flow">知识与消费</button><button role="tab" id="tab-effects" aria-selected="false" data-tab="effects">纠正与影响</button></div><div id="detail"></div></section>
<footer><span>Ledger → World → Slice → Agent → Effect</span><span>展示步进，非运行时重放 · 未采集的依赖不作推断</span><button id="download">下载当前记录</button></footer>
</main><script type="module" src="app.mjs"></script>
</body></html>
