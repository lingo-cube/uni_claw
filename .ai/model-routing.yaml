# Canonical Routing Configuration — UniClaw Agent Runtime
#
# THIS FILE is the single executable routing truth.
# .ai/agent-routing.md is human-readable explanation only — it must not contradict this file.
# Host adapters may consume this file but must not redefine its logical roles.
#
# version: 5
# date: 2026-08-24

notes:
  - "Logical aliases are portable across AI Coder Hosts; they are not necessarily API model IDs."
  - "Provider/fallback routing is execution policy and stays outside portable RoleProfile bodies."
  - "Codex custom agents live under .codex/agents; explicit spawn settings override tier defaults."
  - "ROUTING_CAPABILITY_LIMIT applies only when the current host does not expose the configured custom agent or model."
  - "LEADER DECIDES. WORKER EXECUTES. 模型供应商不决定职责。职责先定义，再映射到具体 provider/model。"

# ── Canonical Provider-Agnostic Roles ─────────────────────────────────────────
#
# These two logical roles are the foundation of the development model.
# Every provider MUST map them to its own concrete model identifiers.
# Development protocols reference these roles, not provider-specific model names.
#
# PROJECT_LEADER_MODEL:
#   - Owns canonical decisions: lane selection, semantic commitment, worker dispatch,
#     auto-continue, Architecture Fit, Gate judgment, scope, ownership, authority.
#   - HIGH_REASONING tier minimum.
#   - Must remain the high-reasoning model for the duration of the development loop.
#
# EXECUTION_WORKER_MODEL:
#   - Performs bounded execution: implementation, testing, diagnosis, repair,
#     evidence collection, validation, docs reconciliation.
#   - LIGHTWEIGHT tier.
#   - Must not independently commit semantic, architecture, ownership, authority,
#     invariant, or scope decisions.
#   - Worker output is evidence/input for the Project Leader.
#   - Worker completion != canonical task completion.

canonical_roles:
  PROJECT_LEADER_MODEL:
    authority: canonical
    tier: leader
    min_reasoning: medium
    reasoning_policy:
      routing: low
      normal_decision: medium
      architecture: high
    owns:
      - lane_selection
      - semantic_commitment
      - worker_dispatch
      - auto_continue_decision
      - architecture_fit_judgment
      - gate_judgment
      - scope_decision
      - ownership_decision
      - authority_decision
      - invariant_interpretation
      - canonical_state_transition
      - architecture_prior_falsification_judgment
      - semantic_admission_commitment
      - corpus_promotion_decision
      - next_capability_priority
      - human_decision_compression
  EXECUTION_WORKER_MODEL:
    authority: bounded_execution
    tier: fast_or_standard
    may_perform:
      - repository_inspection
      - implementation
      - test_creation
      - build_execution
      - targeted_validation
      - regression_execution
      - failure_diagnosis
      - bounded_repair
      - fixture_repair
      - docs_reconciliation
      - evidence_collection
      - failure_minimization
      - fixture_construction
      - short_chain_asset_construction
      - recorded_replay_asset_construction
      - coverage_failure_clustering
      - escalation_recommendation
    must_not_commit:
      - new_cp
      - new_reality_model
      - semantic_expansion
      - architecture_expansion
      - ownership_transfer
      - authority_transfer
      - dependency_direction_change
      - invariant_change
      - safety_semantic_change
      - scope_expansion
      - architecture_prior_adoption_or_rejection
      - corpus_promotion
      - next_capability_priority_commitment
      - human_gate_decision

# ── Provider Mapping ──────────────────────────────────────────────────────────
#
# Each provider maps canonical roles to concrete model identifiers.
# Changing provider MUST NOT change architecture invariants, semantic authority,
# Human Gate rules, Hard Gate rules, or auto-continue semantics.
# Provider/model is execution policy. It is NOT project semantics.

providers:
  openai:
    PROJECT_LEADER_MODEL: "gpt-5.6-sol"
    EXECUTION_WORKER_MODEL: "gpt-5.6-luna"
    notes:
      - "GPT-5.6 Sol → Project Leader role"
      - "GPT-5.6 Luna → Execution Worker role"

  anthropic:
    PROJECT_LEADER_MODEL: "opus"
    EXECUTION_WORKER_MODEL: "haiku"
    notes:
      - "Anthropic Opus → Project Leader role"
      - "Anthropic Haiku → Execution Worker role"

  codex:
    PROJECT_LEADER_MODEL: "gpt-5.6-sol"
    EXECUTION_WORKER_MODEL: "gpt-5.6-luna"
    notes:
      - "Codex shares OpenAI model identifiers."
      - "Leader = main_task_session with high reasoning."
      - "Worker = inline_or_subagent with low/medium reasoning."

# ── Mixed-Provider Support ────────────────────────────────────────────────────
#
# The logical role model permits mixed-provider execution unless the current
# Harness requires same-provider. For example:
#
#   Anthropic Opus Leader → GPT-5.6 Luna Worker
#   GPT-5.6 Sol Leader → Anthropic Haiku Worker
#
# provided role authority remains unchanged and worker capability is sufficient.

mixed_provider:
  supported: true
  constraint: "role_authority_unchanged AND worker_capability_sufficient"
  note: "Do NOT assume provider identity implies authority. Authority derives from role, not model name."

# ── Logical Tiers ──────────────────────────────────────────────────────────────

tiers:
  leader:
    purpose: "Top-level coordination, phase decisions, final integration judgment, Human Gate."
    min_reasoning: "medium; architecture and invariant decisions require high"
    codex:
      selector: "main_task_session"
      model: "gpt-5.6-sol"
      reasoning: "medium"
      reasoning_overrides:
        routing: "low"
        architecture: "high"
      fallback_chain:
        - "ask-user"

  expert:
    purpose: "Decision-dense refactor, cross-module reasoning, deep failure diagnosis, semantic gate, scenario/contract design, architecture tradeoff, ownership/authority conflict."
    min_reasoning: "high"
    codex:
      selector: "inline_or_subagent"
      model: "gpt-5.6-sol"
      reasoning: "high"
      fallback_chain:
        - "codex-main-high"

  standard:
    purpose: "Contract-driven implementation, normal phase control, normal scenario/test work, independent validation."
    min_reasoning: "medium"
    codex:
      selector: "inline_or_subagent"
      model: "gpt-5.6-luna"
      reasoning: "medium"
      fallback_chain:
        - "codex-main"

  fast:
    purpose: "Read-only retrieval, log parsing, symbol lookup, documentation sync, repetitive test updates, reference/path updates, mechanical refactor, narrow low-risk implementation task."
    min_reasoning: "low"
    codex:
      selector: "custom_agent_or_explicit_spawn"
      model: "gpt-5.6-luna"
      reasoning: "low"
      fallback_chain:
        - "codex-main"

# ── Role → Tier Mapping ──────────────────────────────────────────────────────

roles:
  project-leader:
    tier: "leader"
  module-worker:
    tier: "standard"
  phase-evolution-controller:
    tier: "standard"
  scenario-architect:
    tier: "expert"
  runtime-coder:
    tier: "standard"
  runtime-validator:
    tier: "standard"
  openspec-researcher:
    tier: "fast"
  openspec-coder:
    tier: "standard"
  openspec-refactorer:
    tier: "expert"

# Codex adapters combine the stable module-worker RoleProfile with one
# ExecutionProfile. ModuleProfile and WorkItem are supplied per dispatch.
codex_profile_adapters:
  module-worker:
    config: ".codex/agents/module-worker.toml"
    role_profile: "module-worker"
    execution_profile: "development"
    model_ref: "providers.codex.EXECUTION_WORKER_MODEL"
  test-author:
    config: ".codex/agents/test-author.toml"
    role_profile: "module-worker"
    execution_profile: "test-authoring"
    model_ref: "providers.codex.EXECUTION_WORKER_MODEL"
  verifier:
    config: ".codex/agents/verifier.toml"
    role_profile: "module-worker"
    execution_profile: "verification"
    model_ref: "providers.codex.EXECUTION_WORKER_MODEL"
  semantic-analyzer:
    config: ".codex/agents/semantic-analyzer.toml"
    role_profile: "module-worker"
    execution_profile: "semantic-analysis"
    model_ref: "providers.codex.EXECUTION_WORKER_MODEL"

# ── Architecture Escalation ───────────────────────────────────────────────────
#
# Even when a role's default tier is standard, the following conditions
# require escalation to expert (or Human Gate):
#
#   expert escalation:
#     - new production field requiring semantic justification
#     - new component
#     - new interface with architecture meaning
#     - ownership change
#     - authority change
#     - invariant interpretation
#     - frozen decision challenge
#     - Scenario / Spec conflict
#     - repeated implementation failure suggesting model insufficiency
#
#   HUMAN_GATE (stop, do not continue):
#     - invariant change
#     - frozen Human Gate decision change
#     - irreconcilable ownership/authority decision

# ── Workers ───────────────────────────────────────────────────────────────────

workers:
  openspec-researcher:
    tier: "fast"
    adapters:
      codex:
        config: ".codex/agents/openspec-researcher.toml"
        model: "gpt-5.6-luna"
    intended_for:
      - repository inspection
      - OpenSpec artifact reading
      - scenario/test/failure evidence mining
      - symbol lookup
      - log/result parsing
      - read-only reference/path audit
    forbidden_for:
      - semantic decision
      - architecture decision
      - ownership change
      - authority change
      - invariant change
      - new architecture component
      - phase decision
    override_rule:
      preferred_worker: "Task Contract may express a preference for this worker."
      conditions:
        - "Task is read-only"
        - "Scope is narrow"
        - "Task requires no semantic or architecture decision"
        - "Worker permissions cover requested operation"
      violation: "Ignore worker preference; escalate to runtime-coder or expert review."

# ── Default Coding Routes ─────────────────────────────────────────────────────
#
#   Normal production implementation:
#     runtime-coder → standard → Codex preferred
#
#   Small mechanical task:
#     runtime-coder / helper task → fast model through an explicitly writable approved route
#     openspec-researcher remains read-only and must not be used for file changes
#
#   Complex implementation:
#     runtime-coder → expert escalation → Codex high-reasoning / expert route
#
#   Architecture judgment:
#     DO NOT dispatch to coder worker.
#     Route to: scenario-architect or project-leader.

# ── Validator Independence ────────────────────────────────────────────────────
#
#   runtime-validator default tier: standard
#   Independence means: fresh context, repository truth reload,
#     no trust in coder report, independent scenario/boundary verification.
#   Different provider/model is allowed but NOT required.

# ── Fallback Policy ───────────────────────────────────────────────────────────

policy:
  silent_downgrade: "forbidden"
  stronger_tier: "allowed"
  top_level_planning_min_tier: "leader"
  architecture_decision_min_tier: "expert"
  read_only_retrieval_max_tier: "fast_unless_context_requires_higher"
  fallback_can_change_model: true
  fallback_cannot_reduce:
    - "role responsibility"
    - "semantic authority requirement"
    - "minimum reasoning tier"
  fallback_exhausted: "STOP — ROUTING_UNAVAILABLE (do not silently use weaker worker)"

# ── Documentation ─────────────────────────────────────────────────────────────
#
#   .ai/development-protocol.md  = HOW development works (authoritative)
#   .ai/model-routing.yaml       = WHO / WHAT execution route (canonical — this file)
#   .ai/agent-routing.md         = human-readable explanation / navigation only
#   AGENTS.md                    = repository map
#   .codex/ and .dsh/            = Host adapters only
#   CLAUDE.md                    = stateless AGENTS.md compatibility pointer
#
#   These files MUST NOT independently redefine:
#     Scenario Purchase, Human Gate, Ownership rules, Development Loop.
#   Those rules come only from .ai/development-protocol.md.
