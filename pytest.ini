[pytest]
# Pytest configuration for Uni-Claw testing

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async support - pytest-asyncio configuration
# Using pytest-asyncio auto mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    # NOTE: Coverage is run selectively, not by default
    # Uncomment to enable:
    # --cov=src
    # --cov-report=term-missing
    # --cov-report=html

# Warning filters for CI/CD compatibility
filterwarnings =
    # Ignore DeprecationWarning from legacy src.state module (V6.13.0 migration)
    # This allows tests to use backward compatibility imports without CI failures
    ignore::DeprecationWarning:src.state

# Markers
markers =
    # Test type markers
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require additional setup)
    e2e: End-to-end tests
    slow: Slow-running tests
    asyncio: Async tests (requires pytest-asyncio)

    # Module-specific markers
    simulation: Simulation-based tests
    ai: AI module tests
    graph: Graph module tests
    adb: ADB module tests
    traversal: Traversal module tests

    # API call markers
    real_api: Tests that make real API calls (may have cost)
    mock_api: Tests using mock providers (zero cost)

# Coverage options
[coverage:run]
branch = True
source = src
omit =
    */tests/*
    */__init__.py
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov