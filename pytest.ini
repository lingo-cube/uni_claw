[pytest]
# Pytest configuration for Uni-Claw simulation testing

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=src/simulation
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    integration: Integration tests (may require additional setup)
    simulation: Simulation-based tests
    slow: Slow-running tests
    unit: Unit tests (fast, isolated)
    e2e: End-to-end tests

# Coverage options
[coverage:run]
branch = True
source = src/simulation
omit =
    */tests/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov