name: custom-driven
version: 1
description: Custom workflow with documentation sync requirements
artifacts:
  - id: proposal
    generates: proposal.md
    description: High-level description of the change, its motivation, and scope
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications with requirements and scenarios
    template: specs/spec.md
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    requires:
      - specs
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with documentation sync requirements
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings (phases)
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      **Documentation Sync Requirement**:
      All implementation changes MUST include documentation updates:
      - If changing module structure → Update docs/architecture/modules/{module}-design.md
      - If adding new functionality → Update relevant design docs
      - Always check design vs code consistency before completion

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    **Documentation Sync Check**:
    Before marking tasks complete, verify:
    - Design docs reflect actual implementation
    - Version numbers are updated
    - Class/interface descriptions match code
    - Dependencies are accurately documented
