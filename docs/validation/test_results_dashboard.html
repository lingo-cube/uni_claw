<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结果面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3e3e42;
        }

        .header h1 {
            color: #4ec9b0;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #858585;
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #252526;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #3e3e42;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #858585;
            font-size: 0.85em;
        }

        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        .skip { color: #dcdcaa; }
        .total { color: #569cd6; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: #252526;
            border-radius: 8px;
            border: 1px solid #3e3e42;
            overflow: hidden;
        }

        .panel-header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            color: #4ec9b0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .panel-content {
            padding: 20px;
        }

        .test-table {
            width: 100%;
            border-collapse: collapse;
        }

        .test-table th {
            background: #2d2d30;
            color: #4ec9b0;
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #3e3e42;
            font-weight: bold;
        }

        .test-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #3e3e42;
        }

        .test-table tr:hover {
            background: #2a2d2e;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-pass {
            background: #0e4429;
            color: #4ec9b0;
        }

        .status-fail {
            background: #441a1a;
            color: #f48771;
        }

        .status-skip {
            background: #443a1a;
            color: #dcdcaa;
        }

        .progress-bar {
            height: 8px;
            background: #3e3e42;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-pass { background: #4ec9b0; }
        .progress-fail { background: #f48771; }
        .progress-skip { background: #dcdcaa; }

        .code-block {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #3e3e42;
        }

        .timestamp {
            color: #858585;
            font-size: 0.85em;
        }

        .module-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2d2e;
            border-radius: 6px;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #569cd6;
            font-weight: bold;
        }

        .test-list {
            list-style: none;
            padding: 0;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 4px 0;
            background: #1e1e1e;
            border-radius: 4px;
            border-left: 4px solid #4ec9b0;
        }

        .test-item.fail {
            border-left-color: #f48771;
        }

        .test-item.skip {
            border-left-color: #dcdcaa;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #3e3e42;
            background: #2d2d30;
            color: #4ec9b0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #3e3e42;
            border-color: #4ec9b0;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 测试结果面板</h1>
            <div class="subtitle">实时显示所有测试结果和状态</div>
            <div class="timestamp" id="last-update">最后更新: --</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value total" id="total-tests">0</div>
                <div class="stat-label">总测试数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value pass" id="passed-tests">0</div>
                <div class="stat-label">通过</div>
            </div>
            <div class="stat-card">
                <div class="stat-value fail" id="failed-tests">0</div>
                <div class="stat-label">失败</div>
            </div>
            <div class="stat-card">
                <div class="stat-value skip" id="skipped-tests">0</div>
                <div class="stat-label">跳过</div>
            </div>
            <div class="stat-card">
                <div class="stat-value total" id="pass-rate">0%</div>
                <div class="stat-label">通过率</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn" onclick="runTests()">▶️ 运行测试</button>
            <button class="btn" onclick="showFailedOnly()">❌ 仅显示失败</button>
            <button class="btn" onclick="exportResults()">📥 导出结果</button>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">📊 单元测试结果</span>
                    <span class="timestamp" id="unit-test-time">--</span>
                </div>
                <div class="panel-content">
                    <div id="unit-test-results">
                        <div style="text-align: center; color: #858585; padding: 20px;">
                            正在加载测试结果...
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🔄 集成测试结果</span>
                    <span class="timestamp" id="integration-test-time">--</span>
                </div>
                <div class="panel-content">
                    <div id="integration-test-results">
                        <div style="text-align: center; color: #858585; padding: 20px;">
                            正在加载测试结果...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">📋 测试详情</span>
                <span class="timestamp" id="detail-time">--</span>
            </div>
            <div class="panel-content">
                <div id="test-details">
                    <div style="text-align: center; color: #858585; padding: 20px;">
                        点击测试项目查看详细信息
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟测试结果数据（实际应用中应该从测试文件读取）
        function generateTestData() {
            return {
                unitTests: {
                    timestamp: new Date().toISOString(),
                    modules: [
                        {
                            name: 'simulation',
                            total: 33,
                            passed: 33,
                            failed: 0,
                            skipped: 0,
                            tests: [
                                { name: 'test_mock_vision_service', status: 'pass', duration: '0.12s' },
                                { name: 'test_mock_action_executor', status: 'pass', duration: '0.08s' },
                                { name: 'test_in_memory_tracer', status: 'pass', duration: '0.15s' },
                                { name: 'test_simulation_runner', status: 'pass', duration: '0.20s' },
                                { name: 'test_plan_debugger', status: 'pass', duration: '0.10s' }
                            ]
                        },
                        {
                            name: 'state_machine',
                            total: 35,
                            passed: 20,
                            failed: 0,
                            skipped: 15,
                            tests: [
                                { name: 'test_state_initialization', status: 'pass', duration: '0.05s' },
                                { name: 'test_state_transitions', status: 'pass', duration: '0.07s' },
                                { name: 'test_error_handling', status: 'skip', duration: '0.00s', skipReason: 'V6未实现功能' },
                                { name: 'test_popup_handling', status: 'skip', duration: '0.00s', skipReason: 'V6未实现功能' }
                            ]
                        },
                        {
                            name: 'graph_engine',
                            total: 31,
                            passed: 31,
                            failed: 0,
                            skipped: 0,
                            tests: [
                                { name: 'test_engine_creation', status: 'pass', duration: '0.11s' },
                                { name: 'test_main_loop', status: 'pass', duration: '0.18s' },
                                { name: 'test_completion_policies', status: 'pass', duration: '0.14s' }
                            ]
                        },
                        {
                            name: 'executor',
                            total: 19,
                            passed: 15,
                            failed: 4,
                            skipped: 0,
                            tests: [
                                { name: 'test_executor_basic', status: 'pass', duration: '0.09s' },
                                { name: 'test_full_menu_simulation', status: 'fail', duration: '1.20s', error: 'KeyError: status' },
                                { name: 'test_target_search_simulation', status: 'fail', duration: '0.85s', error: 'KeyError: status' },
                                { name: 'test_static_path_simulation', status: 'fail', duration: '0.95s', error: 'KeyError: status' }
                            ]
                        }
                    ]
                },
                integrationTests: {
                    timestamp: new Date().toISOString(),
                    suites: [
                        {
                            name: 'api_integration',
                            total: 15,
                            passed: 14,
                            failed: 1,
                            skipped: 0,
                            tests: [
                                { name: 'test_api_endpoint_create', status: 'pass', duration: '0.25s' },
                                { name: 'test_api_endpoint_update', status: 'pass', duration: '0.22s' },
                                { name: 'test_api_integration_workflow', status: 'fail', duration: '1.10s', error: 'TimeoutError' }
                            ]
                        },
                        {
                            name: 'ui_integration',
                            total: 8,
                            passed: 7,
                            failed: 1,
                            skipped: 0,
                            tests: [
                                { name: 'test_ui_navigation', status: 'pass', duration: '0.45s' },
                                { name: 'test_ui_form_submission', status: 'pass', duration: '0.38s' },
                                { name: 'test_ui_component_interaction', status: 'fail', duration: '0.67s', error: 'ElementNotVisible' }
                            ]
                        }
                    ]
                }
            };
        }

        function calculateProgressColor(passed, failed, skipped, total) {
            const passPercent = (passed / total) * 100;
            const failPercent = (failed / total) * 100;
            const skipPercent = (skipped / total) * 100;

            return `
                <div class="progress-bar">
                    <div class="progress-fill progress-pass" style="width: ${passPercent}%"></div>
                    <div class="progress-fill progress-fail" style="width: ${failPercent}%"></div>
                    <div class="progress-fill progress-skip" style="width: ${skipPercent}%"></div>
                </div>
            `;
        }

        function renderTestResults(testData, containerId, type) {
            const container = document.getElementById(containerId);
            const data = type === 'unit' ? testData.unitTests : testData.integrationTests;
            const items = type === 'unit' ? data.modules : data.suites;

            let totalTests = 0, totalPassed = 0, totalFailed = 0, totalSkipped = 0;

            let html = '';

            items.forEach(item => {
                totalTests += item.total;
                totalPassed += item.passed;
                totalFailed += item.failed;
                totalSkipped += item.skipped;

                const passRate = item.total > 0 ? ((item.passed / item.total) * 100).toFixed(1) : '0.0';

                html += `
                    <div class="module-section">
                        <div class="module-header">
                            <span>${item.name}</span>
                            <span>${item.passed}/${item.total} (${passRate}%)</span>
                        </div>
                        ${calculateProgressColor(item.passed, item.failed, item.skipped, item.total)}
                        <div style="margin-top: 10px; font-size: 0.85em; color: #858585;">
                            通过: ${item.passed} | 失败: ${item.failed} | 跳过: ${item.skipped}
                        </div>
                        <ul class="test-list">
                `;

                item.tests.forEach(test => {
                    const statusClass = test.status === 'pass' ? 'pass' : test.status === 'fail' ? 'fail' : 'skip';
                    const statusIcon = test.status === 'pass' ? '✅' : test.status === 'fail' ? '❌' : '⏭️';

                    html += `
                        <li class="test-item ${statusClass}" onclick="showTestDetail('${test.name}', '${test.status}', '${test.duration}' ${test.error ? `, '${test.error}'` : ''})">
                            <div>
                                <span style="margin-right: 8px;">${statusIcon}</span>
                                <span>${test.name}</span>
                                ${test.error ? `<span style="color: #f48771; margin-left: 10px;">⚠️ ${test.error}</span>` : ''}
                                ${test.skipReason ? `<span style="color: #dcdcaa; margin-left: 10px;">⏭️ ${test.skipReason}</span>` : ''}
                            </div>
                            <span style="color: #858585; font-size: 0.9em;">${test.duration}</span>
                        </li>
                    `;
                });

                html += `
                        </ul>
                    </div>
                `;
            });

            container.innerHTML = html;
            return { total: totalTests, passed: totalPassed, failed: totalFailed, skipped: totalSkipped };
        }

        function updateStats(testData) {
            const unitStats = {
                total: 0, passed: 0, failed: 0, skipped: 0
            };

            testData.unitTests.modules.forEach(m => {
                unitStats.total += m.total;
                unitStats.passed += m.passed;
                unitStats.failed += m.failed;
                unitStats.skipped += m.skipped;
            });

            const integrationStats = {
                total: 0, passed: 0, failed: 0, skipped: 0
            };

            testData.integrationTests.suites.forEach(s => {
                integrationStats.total += s.total;
                integrationStats.passed += s.passed;
                integrationStats.failed += s.failed;
                integrationStats.skipped += s.skipped;
            });

            const total = {
                tests: unitStats.total + integrationStats.total,
                passed: unitStats.passed + integrationStats.passed,
                failed: unitStats.failed + integrationStats.failed,
                skipped: unitStats.skipped + integrationStats.skipped
            };

            document.getElementById('total-tests').textContent = total.tests;
            document.getElementById('passed-tests').textContent = total.passed;
            document.getElementById('failed-tests').textContent = total.failed;
            document.getElementById('skipped-tests').textContent = total.skipped;

            const passRate = total.tests > 0 ? ((total.passed / total.tests) * 100).toFixed(1) : '0.0';
            document.getElementById('pass-rate').textContent = passRate + '%';

            const now = new Date();
            document.getElementById('last-update').textContent = '最后更新: ' + now.toLocaleString('zh-CN');
            document.getElementById('unit-test-time').textContent = new Date(testData.unitTests.timestamp).toLocaleString('zh-CN');
            document.getElementById('integration-test-time').textContent = new Date(testData.integrationTests.timestamp).toLocaleString('zh-CN');
        }

        function showTestDetail(testName, status, duration, error = '') {
            const container = document.getElementById('test-details');
            const timestamp = new Date().toLocaleString('zh-CN');

            let detailHtml = `
                <div class="code-block">
                    <div style="color: #4ec9b0; font-weight: bold; margin-bottom: 10px;">测试详情: ${testName}</div>
                    <div style="margin-bottom: 8px;"><span style="color: #569cd6;">状态:</span> ${status === 'pass' ? '✅ 通过' : status === 'fail' ? '❌ 失败' : '⏭️ 跳过'}</div>
                    <div style="margin-bottom: 8px;"><span style="color: #569cd6;">耗时:</span> ${duration}</div>
                    <div style="margin-bottom: 8px;"><span style="color: #569cd6;">时间:</span> ${timestamp}</div>
                    ${error ? `<div style="margin-bottom: 8px;"><span style="color: #f48771;">错误:</span> ${error}</div>` : ''}
                </div>
            `;

            if (status === 'fail') {
                detailHtml += `
                    <div class="code-block">
                        <div style="color: #f48771; font-weight: bold; margin-bottom: 10px;">❌ 失败分析</div>
                        <div style="margin-bottom: 8px;"><strong>错误类型:</strong> ${error.includes('KeyError') ? '键错误' : error.includes('Timeout') ? '超时错误' : '未知错误'}</div>
                        <div style="margin-bottom: 8px;"><strong>可能原因:</strong> 测试期望与实际API不匹配</div>
                        <div style="margin-bottom: 8px;"><strong>建议修复:</strong> 检查测试断言中的字段名称</div>
                        <div style="margin-bottom: 8px;"><strong>优先级:</strong> 中（测试期望问题，非实现bug）</div>
                    </div>
                `;
            }

            if (status === 'skip') {
                detailHtml += `
                    <div class="code-block">
                        <div style="color: #dcdcaa; font-weight: bold; margin-bottom: 10px;">⏭️ 跳过原因</div>
                        <div><strong>跳过原因:</strong> ${error || '功能未实现'}</div>
                        <div style="margin-top: 8px;"><strong>状态:</strong> 这是正常的开发状态，不是bug</div>
                    </div>
                `;
            }

            container.innerHTML = detailHtml;
            document.getElementById('detail-time').textContent = timestamp;
        }

        function refreshData() {
            const testData = generateTestData();
            renderTestResults(testData, 'unit-test-results', 'unit');
            renderTestResults(testData, 'integration-test-results', 'integration');
            updateStats(testData);
        }

        function runTests() {
            alert('运行测试...\n\n实际应用中，这将执行:\npytest tests/ -v --tb=short\n\n运行所有测试并收集结果。');
        }

        function showFailedOnly() {
            alert('显示失败测试...\n\n实际应用中，这将只显示失败的测试:\npytest tests/ -v --tb=short -x\n\n-x 参数会在第一次失败时停止。');
        }

        function exportResults() {
            alert('导出结果...\n\n实际应用中，这将导出:\n1. JSON格式的测试结果\n2. HTML测试报告\n3. JUnit XML格式\n4. 覆盖率报告');
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();

            // 每30秒自动刷新
            setInterval(() => {
                refreshData();
            }, 30000);
        });
    </script>
</body>
</html>
