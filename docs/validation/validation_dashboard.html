<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation文档监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .content {
            padding: 30px;
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .doc-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .doc-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .doc-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
        }

        .doc-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .risk-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .risk-high {
            background: #fee;
            color: #c33;
        }

        .risk-medium {
            background: #ffc;
            color: #960;
        }

        .risk-low {
            background: #efe;
            color: #393;
        }

        .doc-body {
            padding: 20px;
        }

        .doc-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .info-label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .info-value {
            font-weight: bold;
            color: #333;
        }

        .doc-status {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 15px;
        }

        .status-message {
            color: #495057;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .doc-actions {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .modal-title {
            font-size: 1.8em;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            color: #6c757d;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .doc-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>📊 Validation文档监控面板</h1>
            <p>实时监控所有validation文档的状态和覆盖风险</p>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="total-docs">0</div>
                <div class="stat-label">总文档数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="high-risk">0</div>
                <div class="stat-label">高风险文档</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="compliant">0</div>
                <div class="stat-label">命名符合标准</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="last-update">--</div>
                <div class="stat-label">最后更新</div>
            </div>
        </div>

        <div class="content">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #fee; color: #c33;">🔴</div>
                    <span>高风险 - 需要累积式更新</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffc; color: #960;">🟡</div>
                    <span>中等风险 - 需要注意</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #efe; color: #393;">🟢</div>
                    <span>低风险 - 无覆盖问题</span>
                </div>
            </div>

            <h2 class="section-title">📋 Validation文档状态</h2>
            <div class="doc-grid" id="doc-grid">
                <div class="loading">正在加载文档信息...</div>
            </div>

            <h2 class="section-title">🛠️ 快速操作</h2>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
                <button class="btn btn-success" onclick="runValidationCheck()">✅ 运行命名检查</button>
                <button class="btn btn-secondary" onclick="exportReport()">📥 导出报告</button>
            </div>
        </div>
    </div>

    <!-- 文档详情模态框 -->
    <div class="modal" id="doc-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">文档详情</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // 文档元数据配置
        const DOC_METADATA = {
            'final_report.md': {
                title: '最终验证报告',
                risk: 'low',
                description: '综合验证总结和生产就绪评估',
                useCase: '任务结束时生成一次，包含所有结果和建议',
                updateFrequency: '一次性'
            },
            'unit_test_status.md': {
                title: '单元测试状态',
                risk: 'high',
                description: '所有模块的单元测试结果总览',
                useCase: '多模块测试按顺序执行，需要累积式合并',
                updateFrequency: '每次模块测试后'
            },
            'integration_test_status.md': {
                title: '集成测试状态',
                risk: 'high',
                description: '多个集成测试套件的结果总览',
                useCase: '多测试套件按顺序执行，需要累积式合并',
                updateFrequency: '每个测试套件后'
            },
            'system_infrastructure_analysis.md': {
                title: '系统基础设施分析',
                risk: 'low',
                description: '完整的系统架构和基础设施分析',
                useCase: '一次性架构分析，通常不需要频繁更新',
                updateFrequency: '一次性'
            },
            'test_data_quality.md': {
                title: '测试数据质量',
                risk: 'low',
                description: '所有测试fixtures和数据的完整质量评估',
                useCase: '一次性数据验证，评估所有测试数据质量',
                updateFrequency: '一次性'
            },
            'progress_report.md': {
                title: '当前进度报告',
                risk: 'high',
                description: '项目当前进度和状态报告',
                useCase: '多次进度更新，需要保留历史记录',
                updateFrequency: '每次进度更新'
            },
            'planned_features.md': {
                title: '计划功能/路线图',
                risk: 'low',
                description: '待实现功能规划和发展路线图',
                useCase: '相对稳定的功能规划，不频繁更新',
                updateFrequency: '偶尔更新'
            }
        };

        // 模拟文档数据（实际应用中应该从服务器获取）
        function generateMockData() {
            const mockData = [];
            const now = new Date();

            Object.keys(DOC_METADATA).forEach(filename => {
                const meta = DOC_METADATA[filename];
                const randomOffset = Math.floor(Math.random() * 7);
                const fileDate = new Date(now - randomOffset * 24 * 60 * 60 * 1000);
                const fileSize = Math.floor(Math.random() * 20000) + 5000;

                mockData.push({
                    filename: filename,
                    ...meta,
                    exists: true,
                    size: fileSize,
                    lastModified: fileDate.toISOString(),
                    contentLines: Math.floor(fileSize / 50),
                    status: generateStatus(meta.risk)
                });
            });

            return mockData;
        }

        function generateStatus(risk) {
            const statuses = {
                high: [
                    { type: 'warning', message: '检测到多源更新风险，建议使用累积式合并模式' },
                    { type: 'info', message: '支持多模块/多套件结果自动合并' },
                    { type: 'success', message: '已集成合并工具，可安全处理多次更新' }
                ],
                low: [
                    { type: 'success', message: '文档类型稳定，无覆盖风险' },
                    { type: 'info', message: '通常一次性生成，无需特殊处理' }
                ]
            };

            const statusArray = statuses[risk] || statuses.low;
            return statusArray[Math.floor(Math.random() * statusArray.length)];
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '昨天';
            if (diffDays < 7) return diffDays + '天前';
            return date.toLocaleDateString('zh-CN');
        }

        function getRiskClass(risk) {
            const classes = {
                high: 'risk-high',
                medium: 'risk-medium',
                low: 'risk-low'
            };
            return classes[risk] || 'risk-low';
        }

        function getRiskLabel(risk) {
            const labels = {
                high: '🔴 高风险',
                medium: '🟡 中风险',
                low: '🟢 低风险'
            };
            return labels[risk] || '🟢 低风险';
        }

        function renderDocuments(documents) {
            const grid = document.getElementById('doc-grid');
            grid.innerHTML = '';

            documents.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doc-card';

                const statusClass = {
                    warning: 'btn-warning',
                    info: 'btn-info',
                    success: 'btn-success'
                }[doc.status.type] || 'btn-secondary';

                card.innerHTML = `
                    <div class="doc-header">
                        <div class="doc-title">${doc.title}</div>
                        <div class="risk-badge ${getRiskClass(doc.risk)}">${getRiskLabel(doc.risk)}</div>
                    </div>
                    <div class="doc-body">
                        <div class="doc-info">
                            <div class="info-item">
                                <span class="info-label">文件名</span>
                                <span class="info-value">${doc.filename}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">文件大小</span>
                                <span class="info-value">${formatFileSize(doc.size)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">最后修改</span>
                                <span class="info-value">${formatDate(doc.lastModified)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">更新频率</span>
                                <span class="info-value">${doc.updateFrequency}</span>
                            </div>
                        </div>
                        <div class="doc-status">
                            <div class="status-message">
                                <strong>${doc.status.type === 'warning' ? '⚠️ ' : doc.status.type === 'success' ? '✅ ' : 'ℹ️ '}</strong>
                                ${doc.status.message}
                            </div>
                        </div>
                        <p style="margin-top: 15px; color: #6c757d; font-size: 0.9em;">
                            ${doc.description}
                        </p>
                    </div>
                    <div class="doc-actions">
                        <button class="btn btn-primary" onclick="showDocDetails('${doc.filename}')">📄 查看详情</button>
                        ${doc.risk === 'high' ? '<button class="btn btn-success" onclick="showMergeGuide(\'' + doc.filename + '\')">🛠️ 合并指南</button>' : ''}
                        <button class="btn btn-secondary" onclick="viewFile(\'' + doc.filename + '\')">📖 打开文件</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function showDocDetails(filename) {
            const doc = DOC_METADATA[filename];
            if (!doc) return;

            const modal = document.getElementById('doc-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalTitle.textContent = doc.title;
            modalBody.innerHTML = `
                <div style="line-height: 1.8;">
                    <h3>📄 文档信息</h3>
                    <p><strong>文件名：</strong>${filename}</p>
                    <p><strong>风险等级：</strong>${getRiskLabel(doc.risk)}</p>
                    <p><strong>更新频率：</strong>${doc.updateFrequency}</p>
                    <p><strong>描述：</strong>${doc.description}</p>

                    <h3 style="margin-top: 20px;">🎯 使用场景</h3>
                    <p>${doc.useCase}</p>

                    <h3 style="margin-top: 20px;">⚠️ 风险说明</h3>
                    <div style="background: ${doc.risk === 'high' ? '#fee' : '#efe'}; padding: 15px; border-radius: 6px; margin-top: 10px;">
                        ${doc.risk === 'high' ? `
                            <p><strong>🔴 高风险原因：</strong></p>
                            <ul style="margin-left: 20px;">
                                <li>该文档类型容易遇到多源更新覆盖问题</li>
                                <li>需要使用累积式合并模式而非简单覆盖</li>
                                <li>建议使用专门的合并工具处理</li>
                            </ul>
                            <p style="margin-top: 10px;"><strong>✅ 解决方案：</strong></p>
                            <ul style="margin-left: 20px;">
                                <li>使用 <code>scripts/merge_validation_docs.py</code> 工具</li>
                                <li>每次更新时读取并合并现有内容</li>
                                <li>在文档中保留历史记录</li>
                            </ul>
                        ` : `
                            <p><strong>🟢 低风险说明：</strong></p>
                            <ul style="margin-left: 20px;">
                                <li>该文档类型通常不会有覆盖问题</li>
                                <li>多为一次性生成或整体替换</li>
                                <li>可以直接使用标准更新方式</li>
                            </ul>
                        `}
                    </div>

                    <h3 style="margin-top: 20px;">🛠️ 工具支持</h3>
                    ${doc.risk === 'high' ? `
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px;">
                            <p><strong>推荐的合并工具：</strong></p>
                            <ul style="margin-left: 20px;">
                                <li><code>ValidationDocMerger.append_module_result()</code> - 单元测试模块合并</li>
                                <li><code>ValidationDocMerger.append_integration_suite_result()</code> - 集成测试套件合并</li>
                                <li><code>ValidationDocMerger.add_progress_update()</code> - 进度报告历史更新</li>
                            </ul>
                            <p style="margin-top: 10px;"><strong>使用示例：</strong></p>
                            <pre style="background: #fff; padding: 10px; border-radius: 4px; overflow-x: auto;">from scripts.merge_validation_docs import ValidationDocMerger

merger = ValidationDocMerger()
merger.append_module_result("simulation", {"total": 33, "passed": 33})
merger.append_module_result("state_machine", {"total": 20, "passed": 20})</pre>
                        </div>
                    ` : `
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px;">
                            <p><strong>标准更新方式：</strong></p>
                            <ul style="margin-left: 20px;">
                                <li>直接生成新文档并覆盖现有文档</li>
                                <li>Git历史会追踪所有变化</li>
                                <li>无需特殊的合并处理</li>
                            </ul>
                        </div>
                    `}
                </div>
            `;

            modal.style.display = 'flex';
        }

        function showMergeGuide(filename) {
            alert(`合并指南：${filename}\n\n对于高风险文档，建议使用以下步骤：\n\n1. 检查文档是否存在\n2. 读取现有内容\n3. 解析已有结果\n4. 合并新内容\n5. 保存更新后的文档\n\n详细指南请查看：docs/validation/cumulative_update_guide.md`);
        }

        function viewFile(filename) {
            alert(`打开文件：docs/validation/${filename}\n\n实际应用中，这会在编辑器中打开该文件。`);
        }

        function closeModal() {
            document.getElementById('doc-modal').style.display = 'none';
        }

        function refreshData() {
            const grid = document.getElementById('doc-grid');
            grid.innerHTML = '<div class="loading">正在刷新数据...</div>';

            setTimeout(() => {
                const documents = generateMockData();
                renderDocuments(documents);
                updateStats(documents);
            }, 500);
        }

        function runValidationCheck() {
            alert('运行命名检查...\n\n实际应用中，这将运行：\npython scripts/standardize_validation_docs.py verify\n\n检查所有文档是否符合命名标准。');
        }

        function exportReport() {
            alert('导出报告...\n\n实际应用中，这将生成一个包含所有文档状态的综合报告。');
        }

        function updateStats(documents) {
            document.getElementById('total-docs').textContent = documents.length;
            document.getElementById('high-risk').textContent = documents.filter(d => d.risk === 'high').length;
            document.getElementById('compliant').textContent = documents.filter(d => d.exists).length;
            document.getElementById('last-update').textContent = formatDate(documents[0]?.lastModified || new Date());
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const documents = generateMockData();
            renderDocuments(documents);
            updateStats(documents);
        });

        // 关闭模态框（点击背景）
        document.getElementById('doc-modal').addEventListener('click', (e) => {
            if (e.target.id === 'doc-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
