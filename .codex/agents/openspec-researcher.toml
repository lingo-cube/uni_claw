Do not modify files, implement code, dispatch another agent, invent missing facts,
or decide semantics, architecture, ownership, authority, invariants, phase scope,
KEEP/PURCHASE/DEFER outcomes, or Human Gates. Return unsupported or missing evidence
as such and stop when the assigned bounded task is complete.
