# PROTOCOL-MACHINE-001 — 协议状态机单源（Slice 1：Run 生命周期机全量）。
#
# 地位（D5）：本文件只承载结构——状态 / 转移 / 边挂载 / 良基测度标注；
# 约束语义一律留在协议基线与 ADR，本文只按 D6 三类 ref 引用（基线标题锚 /
# ADR 编号 / payload record 直指 C# 类型）。本文不是第二状态权威。
#
# D9 分栏：机器节点 = 生命周期主干；RunDriveStatus 枚举值只出现在转移边的
# emits 栏，作为观察投影（枚举自注「观察聚合，不新增 canonical state」）。
#
# D10 环二分：进展环必须携带 measure ∈ {steps, rounds, defer-rounds,
# cap-remaining}；合法等待外部的静默环必须标 await: external、不得携带
# measure、不得伪装进展。WaitingForInput 不设节点（observing 自环表达）。
#
# 消费方式：手改本文件后必须运行
#   python3 tools/gen-protocol-machine.py --change <致因 change id>
# 纯再生成免 --change；手改生成产物会被 --check 漂移检测抓出。
version: 1

machines:
  run:
    title: Run 生命周期机（全局一台；语义权威：inter-component-protocol-baseline-l1-l3 §7.2 P24/P25、ADR-0019）
    initial: created
    terminal_nodes: [terminal, closed]
    absorbing: [closed]
    # D9：WaitingForInput / RunDriveStatus 其余 12 值均不是节点。
    nodes:
      - created
      - admitted
      - activated
      - observing
      - deciding
      - acting
      - verifying
      - recovering
      - terminal
      - closed
    transitions:
      # ---- 前奏：created → admitted → activated（P1 / P24）----
      - id: R-T01
        from: created
        to: admitted
        trigger:
          edge: P1
          event: contract-admitted
        guard: proposal valid（同 version 重复 admit 幂等复用；基线 P1 Validity）
        emits: []
      - id: R-T02
        from: admitted
        to: activated
        trigger:
          edge: P24
          event: legal-activation
        guard: accepted Contract View 存在且 activation latch 未持有（幂等；基线 P24 / ADR-0019 §12）
        emits:
          # 观察投影：Drive 在合法激活之前调用 → fail closed（guard 拒绝面）。
          - NotActivated
      - id: R-T03
        from: activated
        to: observing
        trigger:
          event: initial-observation
        guard: activation latch 已由本 driver 持有
        emits: []
      # ---- cycle：observing ⇄ deciding ⇄ acting ⇄ verifying（+recovering）----
      - id: R-T04
        from: observing
        to: deciding
        trigger:
          edge: P25
          event: decision-consultation
        guard: 观察已入 belief（每 Run 决策咨询一次；恢复时从当前 phase 继续）
        emits:
          # 观察投影：stimulus 消费纪律拒绝（context 失配 / unknown input）。
          - UnexpectedInput
      - id: R-T05
        from: deciding
        to: acting
        trigger:
          event: decision-adopted
        guard: proposal 通过校验（V4/V6）+ lease 绑定；拒绝则 fail closed
        emits: []
      # Defer 链：每轮消耗 1 拉取 + 1 再咨询，配额有界（M1/T6 终问）。
      - id: R-T06
        from: deciding
        to: deciding
        trigger:
          event: defer-round
        guard: defer 配额未耗尽；耗尽后下一轮以 DeferRoundsExhausted 相位终问
        measure: defer-rounds
        emits: []
      - id: R-T07
        from: acting
        to: verifying
        trigger:
          edge: P15
          event: dispatch-result-observed
        guard: dispatch 已发出（P14）且下游确认时序门可查
        emits: []
      # 串行验证屏障（不变量 43）：StepVerify 未消费 post-action 证据前
      # 绝不回到 StepAct——良基测度 = 已派发步计数（预算执法）。
      - id: R-T08
        from: verifying
        to: acting
        trigger:
          event: verification-passed
        guard: post-action Evidence 已 accepted 且 reconciliation/verification 清偿
        measure: steps
        emits: []
      - id: R-T09
        from: verifying
        to: observing
        trigger:
          event: round-complete
        guard: 当前步链完成，回到观察（每轮必有进展：≥1 步派发或计划项消费）；terminal 评估证据不足 → 同边投影 TerminalNotProven（保持非终态，继续循环，不猜测）
        measure: rounds
        emits:
          - TerminalNotProven
      # 合法等待外部输入：静默环（D10）。WaitingForInput 不是节点——
      # 它是本自环返回时的观察投影；零新 Effect，再次 Drive() 从断点恢复。
      - id: R-T10
        from: observing
        to: observing
        trigger:
          event: await-external-input
        guard: 初始观察未消费或 post-action evidence 待外部输入；零新 Effect
        await: external
        emits:
          - WaitingForInput
          - AwaitingCompletionAdjudication
      # ---- 恢复屏障（可恢复，非终态）：失败来源相位显式记录 ----
      - id: R-T11
        from: acting
        to: recovering
        trigger:
          event: act-chain-failed
        guard: grounding/gate/delivery 失败——禁止 blind redispatch；cancel 到达但契约未声明 SafeStop obligation → fail closed（非终态）
        emits:
          - GroundingFailed
          - GateRejected
          - UnconfirmedDelivery
          - CancelledWithoutSafeStopPath
      # 操作前/验证后的只读handler等待，不产生新Effect或咨询；
      # 有界截止/取消后从原位置协调，等待本身不伪装本地工作进展。
      - id: R-T18
        from: acting
        to: acting
        trigger:
          event: await-handler-completion
        guard: 已提交typed只读handler且尚无终态；原操作/handler位置保留，完成/截止/取消后串行接回
        await: external
        emits:
          - WaitingForHandler
      - id: R-T12
        from: verifying
        to: recovering
        trigger:
          event: verification-failed
        guard: post-action Evidence/Reconciliation/Assurance 未清偿——禁止下一 Effect
        emits:
          - VerificationFailed
      # 聚焦复查有界上限（PER-009 FocusRetryCap）：恢复重试消耗 cap 测度。
      - id: R-T13
        from: recovering
        to: acting
        trigger:
          event: recovery-retry
        guard: 恢复重试预算未耗尽；超限诚实失败
        measure: cap-remaining
        emits: []
      - id: R-T14
        from: recovering
        to: terminal
        trigger:
          event: recovery-exhausted
        guard: 恢复预算耗尽——诚实终局，不猜测
        emits: []
      # ---- terminal（四分类，TerminalClassification 实证）→ closed 吸收 ----
      - id: R-T15
        from: terminal
        to: closed
        trigger:
          edge: P18
          event: runtime-outcome-emitted
        guard: terminal 评估证据充分（P16/P17）；分类 ∈ {Completion, Failure, SafeStop, Escalation}
        emits:
          # 观察投影：Drive 在已 terminal 的 Run 上调用（幂等，零副作用）。
          - AlreadyTerminal
      # ---- terminal 进入转移（多源汇聚；RunDriveStatus 投影挂各进入边）----
      - id: R-T16
        from: verifying
        to: terminal
        trigger:
          edge: P16
          event: outcome-proof-evaluated
        guard: 完成证明充分 → Completion（证据不足不进 terminal，见 R-T09 的 TerminalNotProven 投影）
        emits:
          - Completed
      - id: R-T17
        from: deciding
        to: terminal
        trigger:
          event: decision-failed-closed
        guard: P25 no-response / correlation 失配 / 越权 proposal / 重复采纳被驳回——fail closed
        emits:
          - AgentDecisionFailed

  # ---- D1②：对象生命周期机（Slice 2）----
  # 状态 = 生命周期主干节点；拒绝原因 / 派生失效等是转移边属性（D9 分栏
  # 同样适用于对象机），不设平行状态。
  binding:
    title: Target Binding 生命周期机（candidate → canonical → consumed / derived-invalid + rejected 出口；事实：Effects/TargetBinding.cs；P9/P10）
    initial: candidate
    terminal_nodes: [consumed, derived-invalid, rejected]
    absorbing: [consumed, derived-invalid, rejected]
    nodes:
      - candidate
      - canonical
      - consumed
      - derived-invalid
      - rejected
    transitions:
      - id: B-T01
        from: candidate
        to: canonical
        trigger:
          edge: P10
          event: binding-canonicalized
        guard: revision current ∧ 无歧义 ∧ target 存在于 current WorldBelief（否则走 B-T02；不变量 24：candidate 无 dispatch 权威）
        emits: []
      - id: B-T02
        from: candidate
        to: rejected
        trigger:
          event: binding-rejected
        # D9：拒绝原因是边属性，不是状态——NoCandidate / StaleRevision /
        # Ambiguous / UnknownTarget（BindingRejectionReason 实证四态）。
        guard: 认定拒绝（BindingDecision.RejectionReason）；短路于 Judge 之前——无 CanonicalBinding、无 AssuranceJudgment（P9 Absence）
        emits: []
      - id: B-T03
        from: canonical
        to: consumed
        trigger:
          edge: P14
          event: dispatch-issued
        guard: judgment（P13）通过 ∧ Gate 允许；同 binding 单次消费（P10 Forbidden：dispatch 后不得二次 dispatch）
        emits: []
      - id: B-T04
        from: canonical
        to: derived-invalid
        trigger:
          event: revision-superseded
        # 派生失效无 event 无边（D8）：binding 依据 revision 不再 current
        # 即失效，复用 Slice 模式。
        guard: 派生失效——依据 revision 不再 current（validity ≠ authorization，P10 Validity）
        emits: []
  judgment:
    title: Assurance Judgment 生命周期机（pending → issued → consumed；issued 后冻结——immutable、单 act 作用域；事实：Assurance/AssuranceJudgment.cs；P13）
    initial: pending
    terminal_nodes: [consumed]
    absorbing: [consumed]
    nodes:
      - pending
      - issued
      - consumed
    transitions:
      - id: J-T01
        from: pending
        to: issued
        trigger:
          edge: P13
          event: assurance-judgment-issued
        guard: 针对三元组 (IntentId + BindingId + RevisionId)；immutable（冻结语义）——issued 后不可改写
        emits: []
      - id: J-T02
        from: issued
        to: consumed
        trigger:
          event: judgment-consumed
        guard: Gate 只执法不重判（不变量 26）；三元组任一成员或 freshness 改变 → 本判定不可复用，须重新 P13
        emits: []
  attempt:
    title: Dispatch Attempt 生命周期机（CommittedPending → Dispatched → Completed / Failed / UnknownOutcome；三态 outcome 实证：DispatchOutcome；事实：Effects/EffectDispatch.cs；P14/P15）
    initial: committed-pending
    terminal_nodes: [completed, failed, unknown-outcome]
    absorbing: [completed, failed, unknown-outcome]
    nodes:
      - committed-pending
      - dispatched
      - completed
      - failed
      - unknown-outcome
    transitions:
      - id: A-T01
        from: committed-pending
        to: dispatched
        trigger:
          edge: P14
          event: dispatch-sent
        guard: EB lowering 产出 DeliveryTarget（locator 唯一载体）；capability 对授权态零感知
        emits: []
      - id: A-T02
        from: dispatched
        to: completed
        trigger:
          edge: P15
          event: delivery-completed
        guard: outcome = DeliveryCompleted——下游确认投递（≠ Effect ≠ Verified Effect，不变量 33/34）
        emits: []
      - id: A-T03
        from: dispatched
        to: failed
        trigger:
          edge: P15
          event: delivery-failed
        guard: outcome = DeliveryFailed——下游确定拒绝 / 传输确定否定，effect 未送达
        emits: []
      - id: A-T04
        from: dispatched
        to: unknown-outcome
        trigger:
          edge: P15
          event: outcome-unknown
        guard: outcome = UnknownOutcome——effect 可能已发生；唯一合法后继 = re-observe，NEVER blind redispatch（DSE-001 invariant）
        emits: []
  contract-view:
    title: Execution Contract View 生命周期机（admitted → activated / frozen；事实：Run/ExecutionContractView.cs + RunModel.AdmitContract；P6/P17）
    initial: admitted
    terminal_nodes: [frozen]
    absorbing: [frozen]
    # admitted 由 P24 activation record 消费；未激活不再作为永久悬挂接缝。
    hang_whitelist: []
    nodes:
      - admitted
      - activated
      - frozen
    transitions:
      - id: CV-T00
        from: admitted
        to: activated
        trigger:
          edge: P24
          event: activation-record-finalized
        guard: accepted View 的 activation record 已 finalized 并绑定真实 RunId；同 key 重放复用原记录
        emits: []
      - id: CV-T01
        from: activated
        to: frozen
        trigger:
          event: run-terminal-freeze
        guard: terminal Outcome State 已记录（P17）→ View 冻结：immutable，late evidence / receipt 不得改写
        emits: []

  # ---- P24：持久 activation record 对象机 ----
  # Run canonical state 仍由 run 机表达；本机只表达 activation key 的
  # reserved → terminal 记录，以及 failed/blocked 的 fail-closed 分支。
  activation-record:
    title: P24 Activation Record 生命周期机（Host Runtime ActivationRecord；P24 / ADR-0019 §12）
    initial: reserved
    terminal_nodes: [finalized, failed, blocked]
    absorbing: [finalized, failed, blocked]
    nodes:
      - reserved
      - finalized
      - failed
      - blocked
    transitions:
      - id: AR-T01
        from: reserved
        to: finalized
        trigger:
          edge: P24
          event: activation-finalized
        guard: 初次提交或按原 activation key 显式 resume 后真实 RunId 已绑定；同 key 重放返回原 finalized record
        emits: []
      - id: AR-T02
        from: reserved
        to: failed
        trigger:
          edge: P24
          event: activation-failed
        guard: binding / contract / activation 校验确定失败；零新 Run、零新 Effect
        emits: []
      - id: AR-T03
        from: reserved
        to: blocked
        trigger:
          edge: P24
          event: activation-blocked
        guard: reserved 中断且无法证明原 owner；只能按原 key 显式 resume，禁止重新 mint
        emits: []

  # ---- P25：consultation journal 对象机 ----
  # 每个四元组 (runId, contractViewRef, decisionBoundaryId,
  # consultationCorrelationId) 是独立实例；同 correlation 的 transport
  # retry 只回放原记录，新 semantic correlation 创建新实例并消耗 HardCap。
  consultation-journal:
    title: P25 Consultation Journal 生命周期机（Kernel Runtime ConsultationJournal；P25 / ADR-0050）
    initial: pending
    terminal_nodes: [completed, rejected]
    absorbing: [completed, rejected]
    nodes:
      - pending
      - completed
      - rejected
    transitions:
      - id: CJ-T01
        from: pending
        to: completed
        trigger:
          edge: P25
          event: consultation-completed
        guard: 同一四元组与 request fingerprint 匹配；结果持久化后同 correlation retry 只回放
        emits: []
      - id: CJ-T02
        from: pending
        to: rejected
        trigger:
          edge: P25
          event: consultation-rejected
        guard: correlation / proposal 校验失败或 fail-closed；本 semantic consultation 计一次 HardCap
        emits: []
      - id: CJ-T03
        from: pending
        to: rejected
        trigger:
          edge: P25
          event: consultation-timeout
        guard: no-response / timeout 持久化为 rejected；不得产生 Effect；本 semantic consultation 计一次 HardCap
        emits: []
      # transport retry 不创建新语义，也不再次消耗 HardCap；外部传输重试
      # 只允许沿原 correlation 回放同一 journal entry。
      - id: CJ-T04
        from: pending
        to: pending
        trigger:
          edge: P25
          event: same-correlation-transport-retry
        guard: correlation 与 fingerprint 相同；继续等待原结果
        await: external
        emits: []
# ---- 协议边登记（D11：kind/status 封闭词汇；id 命名空间 P##/O##/G##）----
# Slice 1 只登记 run 机转移引用的边；object 机边（Slice 2）/ 图审计（Slice 3）
# / 文档出口（Slice 4）不在本文件，缺sections 即缺席，不留 stub。
edges:
  - id: P1
    kind: edge
    status: keep
    title_anchor: "### P1 Execution Contract Admission（UniAgent → Run Model）"
    from: uni-agent
    to: run-model
    payload_ref:
      type: record
      name: UniClaw.Kernel.Run.ExecutionContract
  - id: P14
    kind: edge
    status: keep
    title_anchor: "### P14 Dispatch Request（Effect Boundary → Capability Plane）"
    from: effect-boundary
    to: capability-plane
    payload_ref:
      type: record
      name: UniClaw.Kernel.Effects.DispatchRequest
  - id: P15
    kind: edge
    status: keep
    title_anchor: "### P15 Dispatch Result（Capability Plane → Effect Boundary）"
    from: capability-plane
    to: effect-boundary
    payload_ref:
      type: record
      name: UniClaw.Kernel.Effects.DispatchResult
  - id: P16
    kind: edge
    status: keep
    title_anchor: "### P16 Outcome Proof（Assurance → Run Model）"
    from: assurance
    to: run-model
    payload_ref:
      type: record
      name: UniClaw.Kernel.Assurance.OutcomeProof
  - id: P18
    kind: edge
    status: keep
    title_anchor: "### P18 Runtime Outcome（Uni Kernel → UniAgent）"
    from: uni-kernel
    to: uni-agent
    payload_ref:
      type: record
      name: UniClaw.Kernel.Outcome.RuntimeOutcome
  - id: P24
    kind: edge
    status: keep
    title_anchor: "#### P24 Legal Run Activation（Runtime activation path → Uni Kernel internal run driver）"
    from: uni-agent
    to: uni-kernel
    payload_ref:
      type: record
      name: UniClaw.Kernel.Runtime.ActivationResult
  - id: P25
    kind: edge
    status: keep
    title_anchor: "#### P25 Agent Decision Consultation（Uni Kernel internal driver → UniAgent realization，外部 seam）"
    from: uni-kernel
    to: uni-agent
    payload_ref:
      type: record
      name: UniClaw.Kernel.Runtime.AgentDecision
  - id: P2
    kind: edge
    status: keep
    title_anchor: "### P2 Observation Ingress（观察生产者 → Evidence Ledger）"
    from: capability-plane
    to: evidence-ledger
    payload_ref:
      type: record
      name: UniClaw.Kernel.Evidence.ObservationProposal
  - id: P3
    kind: edge
    status: keep
    title_anchor: "### P3 Accepted Evidence Record（Evidence Ledger → World Model）"
    from: evidence-ledger
    to: world-model
    payload_ref:
      type: record
      name: UniClaw.Kernel.Evidence.EvidenceRecord
  - id: P4
    kind: edge
    status: keep
    title_anchor: "### P4 Slice（World Model → Control Loop）"
    from: world-model
    to: control-loop
    payload_ref:
      type: record
      name: UniClaw.Kernel.World.Slice
  - id: P5
    kind: edge
    status: track
    title_anchor: "### P5 Run Snapshot（Run Model → Control Loop）"
    from: run-model
    to: control-loop
    # deferred（no-current-buyer，EXP-008）：RunState 已退出 Control 签名，
    # 边暂无真实 buyer——record 引用指向前聚合类型，buyer 出现再恢复。
    payload_ref:
      type: record
      name: UniClaw.Kernel.Run.RunState
  - id: P6
    kind: edge
    status: keep
    title_anchor: "### P6 Execution Contract View（Run Model → Control Loop / Assurance）"
    from: run-model
    to: control-loop
    payload_ref:
      type: record
      name: UniClaw.Kernel.Run.ExecutionContractView
  - id: P7
    kind: edge
    status: keep
    title_anchor: "### P7 Obligation View（Run Model → Assurance）"
    from: run-model
    to: assurance
    payload_ref:
      type: record
      name: UniClaw.Kernel.Run.ProofObligationState
  - id: P8
    kind: edge
    status: keep
    title_anchor: "### P8 Control Intent（Control Loop → Assurance / Effect Boundary）"
    from: control-loop
    to: assurance
    payload_ref:
      type: record
      name: UniClaw.Kernel.Control.ControlIntent
  - id: P9
    kind: edge
    status: keep
    title_anchor: "### P9 Candidate Binding（Grounding Provider → Effect Boundary）"
    from: capability-plane
    to: effect-boundary
    payload_ref:
      type: record
      name: UniClaw.Kernel.Effects.CandidateBinding
  - id: P10
    kind: edge
    status: keep
    title_anchor: "### P10 Canonical Binding（Effect Boundary → Assurance）"
    from: effect-boundary
    to: assurance
    payload_ref:
      type: record
      name: UniClaw.Kernel.Effects.CanonicalBinding
  - id: P11
    kind: edge
    status: keep
    title_anchor: "### P11 Current WorldBelief View（World Model → Assurance / Effect Boundary）"
    from: world-model
    to: assurance
    payload_ref:
      type: record
      name: UniClaw.Kernel.World.ActionAssuranceView
  - id: P12
    kind: edge
    status: keep
    title_anchor: "### P12 Canonical Records Lookup（Evidence Ledger → Assurance）"
    from: evidence-ledger
    to: assurance
    payload_ref:
      type: record
      name: UniClaw.Kernel.Evidence.EvidenceRecord
  - id: P13
    kind: edge
    status: keep
    title_anchor: "### P13 Assurance Judgment（Assurance → Effect Boundary）"
    from: assurance
    to: effect-boundary
    payload_ref:
      type: record
      name: UniClaw.Kernel.Assurance.AssuranceJudgment
  - id: P17
    kind: edge
    status: keep
    title_anchor: "### P17 Terminal Outcome State（Run Model → Uni Kernel）"
    from: run-model
    to: uni-kernel
    payload_ref:
      type: record
      name: UniClaw.Kernel.Run.OutcomeState
  - id: P19
    kind: edge
    status: track
    title_anchor: "### P19 Goal Evaluation（UniAgent → user/session，未来）"
    from: uni-agent
    to: user-session
    # consumer 面为未来占位；realization（UniClaw.Agent.Evaluation）在 Kernel
    # 测试面之外——payload_ref 待跨组件 buyer 出现再登记。
  - id: P20
    kind: edge
    status: track
    title_anchor: "### P20 Memory Persist（placeholder，→ Memory System）"
    from: uni-agent
    to: memory-system
    # placeholder（Deferred ⑩）：may-persist 对象清单与载荷形状未定。
  - id: P21
    kind: edge
    status: track
    title_anchor: "### P21 Memory Recall（placeholder，Memory System → Agent / Control / World Model）"
    from: memory-system
    to: control-loop
    # placeholder（Deferred ⑩）：non-evidentiary 约束在基线，载荷未定。
  - id: P22
    kind: edge
    status: keep
    title_anchor: "### P22 Runtime Transition Context（Runtime Effect Flow → World Model）"
    from: effect-boundary
    to: world-model
    payload_ref:
      type: record
      name: UniClaw.Kernel.World.TransitionContext
  - id: P23
    kind: edge
    status: keep
    title_anchor: "### P23 Continuity Request Seam（Effect / Obligation path ↔ World Model）"
    from: effect-boundary
    to: world-model
    payload_ref:
      type: record
      name: UniClaw.Kernel.World.UiRealization.CurrentGroundingView
  - id: P27
    kind: edge
    status: keep
    title_anchor: "### P27 Observation Need（World Model → Control Loop）"
    from: world-model
    to: control-loop
    payload_ref:
      type: record
      name: UniClaw.Kernel.World.ObservationNeed
  - id: P26
    kind: edge
    status: keep
    title_anchor: "#### P26 Sealed Trace → ScenarioStimulus（测试 / 治理侧，非产品内边）"
    from: uni-kernel
    to: simulation-host
    payload_ref:
      type: record
      name: UniClaw.Kernel.Trace.RunTraceArtifact
  # ---- O 系：wire·宿主边（schemas/workspace $id 为双方契约；D5/D7）----
  - id: O1
    kind: edge
    status: track
    title_anchor: "O1 · task-launch-request（调用方 → Runtime HTTP；交互模型前奏 0b）"
    from: user-session
    to: uni-kernel
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/task-launch-request/v1
  - id: O2
    kind: edge
    status: track
    title_anchor: "O2 · task-launch-ack（Runtime 铸造；交互模型前奏 0b/0c）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/task-launch-ack/v1
  - id: O3
    kind: edge
    status: track
    title_anchor: "O3 · launch-stage-record（阶段记录：valueOrigin + availability 分离）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/launch-stage-record/v1
  - id: O4
    kind: edge
    status: keep
    title_anchor: "O4 · runtime-run-event（source-native 事件流：DSH / Kernel / 设备 / Runtime）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/runtime-run-event/v1
  - id: O5
    kind: edge
    status: keep
    title_anchor: "O5 · runtime-run-projection（Runtime Run 查询投影，唯一 authority：Runtime Host）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/runtime-run-projection/v1
  - id: O6
    kind: edge
    status: keep
    title_anchor: "O6 · runtime-run-response（单 Run 查询响应）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/runtime-run-response/v1
  - id: O7
    kind: edge
    status: keep
    title_anchor: "O7 · runtime-run-events-response（事件列表响应，nextCursor 分页）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/runtime-run-events-response/v1
  - id: O8
    kind: edge
    status: keep
    title_anchor: "O8 · runtime-run-list-response（Run 列表摘要投影）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/runtime-run-list-response/v1
  - id: O9
    kind: edge
    status: keep
    title_anchor: "O9 · run-report（全链路单 run 报告只读投影，PNL-006）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/run-report/v1
  - id: O10
    kind: edge
    status: keep
    title_anchor: "O10 · capability（五类只读 capability 请求/响应公共封套）"
    from: user-session
    to: uni-kernel
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/capability/v1
  - id: O11
    kind: edge
    status: keep
    title_anchor: "O11 · query-error（结构化查询错误，不返回裸字符串）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/query-error/v1
  - id: O12
    kind: edge
    status: keep
    title_anchor: "O12 · record-envelope（跨来源记录公共封套）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/record-envelope/v1
  - id: O13
    kind: edge
    status: keep
    title_anchor: "O13 · local-storage-namespace（不透明逻辑 namespace 引用）"
    from: uni-kernel
    to: user-session
    payload_ref:
      type: schema
      name: https://uniclaw.dev/schemas/workspace/local-storage-namespace/v1
  # ---- G 系：known gap = 缺边的显式登记（只进渲染与审计，永不进转移合法性）----
  - id: G1
    kind: gap
    status: track
    title_anchor: "观察致动（无编号边 · 审计 D5；交互模型步骤 3）"
    from: control-loop
    to: capability-plane
    # 协议图只建模认知回流（P2），未建模感知指向本身：何时 / 以何 scope
    # 观察目前藏在 driver realization 里；观察指令边等感知策略 buyer。
  - id: G2
    kind: gap
    status: track
    title_anchor: "任务定义（交互模型前奏 0a：Task Catalog，无编号边）"
    from: user-session
    to: uni-kernel
    # Host 侧任务模板目录（ADR-0032），Workspace 只读投影；无跨组件协议边。
  - id: G3
    kind: gap
    status: track
    title_anchor: "Task Instance 创建（交互模型前奏 0c：Runtime 铸造，无独立协议边）"
    from: uni-kernel
    to: uni-kernel
    # known gap：HTTP 创建路径把 Session/Run/Contract admission 混在一个
    # 阶段；目标态 Task → Instance → Session 三阶段可观察（ARCH-ALIGN-001）。
  - id: G4
    kind: gap
    status: track
    title_anchor: "Product Session 分配（交互模型前奏 0d：Runtime 铸造 + 显式 Binding，无编号边）"
    from: uni-kernel
    to: uni-kernel
    # productSessionId 关联根 + Task Launch Binding；当前随 O1/O2 同阶段实现。
  - id: G5
    kind: gap
    status: track
    title_anchor: "契约 Authoring（交互模型前奏 0e：UniAgent 形成，P1 上游，无编号边）"
    from: uni-agent
    to: run-model
    # known deviation：真实 UniAgent authoring 未接线（Goal→Contract
    # derivation = Deferred ⑫），当前 HostRunner 代演。

# ---- 交互模型（Slice 4 第四数据面）：HTML 27 步全量转录（A1/A5） ----
# 地位：渲染数据单源——docs/design/protocol-workflow-steps.generated.js 由本段
# 生成（<script src> 加载，file:// 可用）；HTML 手写 STEPS 副本已删除。
# 字段注记 mark 词汇：必=构造必填 / 选=带默认值或可空 / 准=类型可空但准入
# 要求非空 / 系=系统生成留痕 / —=不适用。st：keep=不动 / fix=修复点（S1–S5）
# / track=既有轨道。edge_ref 指向本文件 edges 登记（无编号边允许缺席）。
interaction_model:
  steps:
    # ---- 前奏 ----
    - group: pre
      "no": "0a"
      name: 任务定义
      edge: "Task Catalog（无编号边）"
      edge_ref: G2
      dir: Host / product/tasks → Runtime
      st: track
      fields:
        - name: task yaml
          type: product/tasks/*.yaml
          desc: settings-coverage / language-inspection / tool-runtime：步数与咨询上限、capability 声明、预检要求
          mark: 必
        - name: catalog 身份
          type: catalog + 版本
          desc: ADR-0032：目录归 Host 所有，Workspace 只读投影
          mark: 必
      note: 任务模板不是一次执行。
    - group: pre
      "no": "0b"
      name: 任务发起
      edge: "O1 · task-launch wire"
      edge_ref: O1
      dir: 调用方 → Runtime HTTP
      st: track
      fields:
        - name: taskRef（逻辑任务引用）
          type: schema 字段
          desc: 不含物理路径/绝对路径（schema 拒收）
          mark: 必
        - name: idempotencyKey
          type: schema 字段
          desc: 幂等键；重复提交复用 binding
          mark: 必
        - name: declaredConfig
          type: schema 字段
          desc: 声明式配置
          mark: 选
        - name: launchId
          type: ack 字段
          desc: Task Instance 尚未生成时可先只返回 launchId
          mark: 系
        - name: stageRecords[]
          type: launch-stage-record.v1
          desc: 阶段记录：valueOrigin ∈ {configured,generated,observed,derived} + availability 分离
          mark: 系
        - name: "⚠️ 两套实例号"
          type: known deviation
          desc: Workbench 本地 instanceId vs Runtime taskInstanceId；psi-* 为兼容路径
          mark: —
      note: wire 面是全仓锁得最好的契约之一（additionalProperties:false + validator + 正反例）。身份统一走 O1 实现 Change。
    - group: pre
      "no": "0c"
      name: Task Instance 创建
      edge: "O2 · Runtime 铸造"
      edge_ref: O2
      dir: Runtime 内部
      st: track
      fields:
        - name: taskInstanceId
          type: string
          desc: Runtime 唯一铸造；调用方不得传入或覆盖（ADR-0045）
          mark: 系
        - name: "⚠️ 阶段混合"
          type: known gap
          desc: HTTP 创建路径把 Session/Run/Contract admission 混在一个阶段，无独立可观察步骤
          mark: —
      note: 目标态：Task → Instance → Session 三阶段可观察（ARCH-ALIGN-001 外围矩阵登记）。
    - group: pre
      "no": "0d"
      name: Product Session 分配
      edge: Runtime 铸造 + 显式 Binding
      edge_ref: G4
      dir: Runtime 内部
      st: track
      fields:
        - name: productSessionId
          type: string
          desc: Goal/Contract/Run/Outcome/Evaluation 的关联根；建立 ≠ 开始执行
          mark: 系
        - name: Task Launch Binding
          type: binding
          desc: Task Instance ↔ Product Session（显式、带来源）；同次提交重试复用
          mark: 系
        - name: hostSessionRef
          type: string
          desc: Host 只铸自己的；dshSessionId 降为 adapter 内部 alias
          mark: 系
      note: 任务结束再执行 → 新 Instance/Session/Run。
    - group: pre
      "no": "0e"
      name: 契约 Authoring
      edge: UniAgent 形成（P1 上游）
      edge_ref: G5
      dir: UniAgent ← Task + Session context
      st: track
      fields:
        - name: Task + Session context
          type: 输入
          desc: UniAgent 读取后细化
          mark: 必
        - name: Execution Contract 候选
          type: 输出
          desc: objective / scope / effect 红线 / proof 要求 / 预算
          mark: 必
        - name: "⚠️ HostRunner 代造"
          type: known deviation
          desc: 真实 UniAgent authoring 未接线（Goal→Contract derivation = Deferred ⑫）
          mark: —
      note: 目标态：UniAgent 是唯一合法作者（P1 只收它的要约）；当前代造走 O3 实现 Change。
    # ---- 契约与激活 ----
    - group: contract
      "no": "1"
      name: P1 契约提交
      edge: "P1 · Execution Contract Admission"
      edge_ref: P1
      dir: UniAgent → Run Model
      st: fix
      fixTag: S3
      fix_ref: PROTOCOL-FIX-003
      fix: S3：预算保持可空，但 admission 记 valueOrigin；配合两层顶（契约=初始额度，policy=硬顶）。
      fields:
        - name: Version
          type: string
          desc: 显式版本；同 version 重复 admit 幂等
          mark: 必
        - name: Objective
          type: string
          desc: 目标
          mark: 必
        - name: Scope
          type: IReadOnlySet?
          desc: 范围
          mark: 选
        - name: AllowedEffects / ForbiddenEffects
          type: IReadOnlySet?
          desc: effect 红线
          mark: 选
        - name: ProofCriteria
          type: list?
          desc: 证明要求（缺省派生不可判定占位义务）
          mark: 选
        - name: Obligations
          type: list? = null
          desc: run-level 义务规格
          mark: 选
        - name: MaxConsultations
          type: int? = null
          desc: 缺省 View 解析为 16
          mark: 选
        - name: MaxTotalSteps
          type: int? = null
          desc: 缺省 View 解析为 256
          mark: 选
        - name: valueOrigin
          type: "＋ S3 新增"
          desc: admission 留痕 ∈ {configured, default}——"沉默缺省"变"有账的缺省"
          mark: 系
        - name: 身份三件套
          type: "🔵 轨道"
          desc: taskInstanceId / productSessionId / contractRef（ADR-0046，不并入本包）
          mark: —
    - group: contract
      "no": "2"
      name: P24 合法激活
      edge: "P24 · Legal Run Activation"
      edge_ref: P24
      dir: activation path → Kernel driver
      st: keep
      fields:
        - name: acceptedContractViewRef + contractGeneration
          type: 启动钥匙
          desc: 同 key 至多一个 Run；重复/并发返回同一关联
          mark: 必
        - name: activation latch
          type: Kernel 内部
          desc: 一次性幂等；admission ≠ 激活
          mark: 系
      note: 跨进程持久身份/并发/恢复 = Deferred ⑰（🔵 轨道）。
    # ---- 观察 ----
    - group: observe
      "no": "3"
      name: 观察致动
      edge: （无编号边 · D5）
      edge_ref: G1
      dir: driver/Control → 感知采集
      st: keep
      fields:
        - name: 编排
          type: driver realization
          desc: 何时/以何 scope 观察目前藏在驱动实现里
          mark: —
        - name: P27 候选
          type: 登记项
          desc: 观察指令边等感知策略 buyer
          mark: —
      note: 协议图只建模了认知回流，没建模感知指向本身（审计 D5）。
    - group: observe
      "no": "4"
      name: P2 观察回流
      edge: "P2 · Observation Ingress"
      edge_ref: P2
      dir: producer → Evidence Ledger
      st: fix
      fixTag: S1
      fix_ref: PROTOCOL-FIX-001
      fix: S1：新增 Origin（一石三鸟：闭 ADR-0047 gap + D6 判定输入 + E5 前提显式化）。
      fields:
        - name: Claim
          type: (Subject, Value)
          desc: 观察声明
          mark: 必
        - name: Kind
          type: enum
          desc: Observation | AttemptReport（封闭二成员）
          mark: 必
        - name: Context
          type: enum
          desc: External | PostActionEffectFlow（流程上下文）
          mark: 必
        - name: Provenance
          type: record?
          desc: 类型可空，但 null/不完整 → admission fail-closed：实效必填
          mark: 准
        - name: DerivedFromEvidenceIds
          type: init = 空
          desc: 空 = 直接源观察；父引用由账本校验
          mark: 选
        - name: TransitiveEvidenceBasis
          type: init = 空
          desc: 账本重算并拒绝不匹配
          mark: 选
        - name: FusionRule / FusionVersion
          type: string?
          desc: 派生（融合）证据携带
          mark: 选
        - name: Origin
          type: "＋ S1 新增"
          desc: External | PostActionSelf——机械推导总有产出：精确 attempt 关联→PostActionSelf，否则 External；禁时间启发式；自报仅诊断
          mark: 必
    - group: observe
      "no": "5"
      name: P3 证据入库
      edge: "P3 · Accepted Evidence Record"
      edge_ref: P3
      dir: Ledger → World Model
      st: fix
      fixTag: S1
      fix_ref: PROTOCOL-FIX-001
      fix: S1：origin 入 EvidenceId canonical 输入。
      fields:
        - name: EvidenceId
          type: 内容哈希
          desc: 相同 canonical 语义 → 同 id（幂等去重）
          mark: 必
        - name: Claim / Kind / Context
          type: 同 P2
          desc: 随记录携带
          mark: 必
        - name: Provenance
          type: record
          desc: 入库后非空（admission 已过）
          mark: 必
        - name: DerivedFrom / TransitiveBasis / Fusion 元数据
          type: 同 P2
          desc: 派生字段
          mark: 选
        - name: Origin 入 canonical 输入
          type: chg S1
          desc: origin 语义变化不得复用同一 id（ING-006 D5 同律）
          mark: 必
    # ---- 决策 ----
    - group: decide
      "no": "6"
      name: P25 咨询 + 续授
      edge: "P25 · Agent Decision Consultation"
      edge_ref: P25
      dir: Kernel driver ⇄ UniAgent
      st: fix
      fixTag: S3
      fix_ref: PROTOCOL-FIX-003
      fix: S3：续授走 P25（不新增边）；步数/轮次同机制各硬顶；轻记账（decision 留痕，不进 Run State）；崩溃恢复随 ⑰。
      fields:
        - name: DecisionId / 关联号
          type: string
          desc: 每 decision boundary 最多一次；同边界重试复用结果
          mark: 必
        - name: 决策上下文
          type: composite
          desc: 含 BudgetRemaining——agent 打包前知道自己还剩多少
          mark: 必
        - name: 续授窗口标记
          type: "＋ S3 新增"
          desc: driver 检查剩余 ≤ policy 阈值 → 本次咨询标记可谈续授
          mark: 选
        - name: 续授提案
          type: "＋ S3 新增"
          desc: UniAgent 给续授量（正常推进未走完→该续就续；也可不续）
          mark: 选
        - name: HardCap 校验
          type: "＋ S3 新增"
          desc: policy 校验 已授+提案 ≤ 硬顶；终问（轮次耗尽最后一次询问）可携带续授——防"有步数没机会开口"
          mark: 系
    # ---- 行动链 ----
    - group: act
      "no": "7"
      name: P8 意图
      edge: "P8 · Control Intent"
      edge_ref: P8
      dir: Control Loop → Assurance / EB
      st: keep
      fields:
        - name: IntentId
          type: string
          desc: 唯一意图标识
          mark: 必
        - name: Kind
          type: enum
          desc: Observe | Act | Recovery
          mark: 必
        - name: EffectClass
          type: string?
          desc: act 意图的效果类（hint ≠ binding）
          mark: 选
        - name: TargetSubject
          type: string?
          desc: 目标提示
          mark: 选
        - name: BasisRevisionId
          type: string
          desc: 依据的世界观版本（currentness 判定输入）
          mark: 必
      note: 唯一意图权威；issuance 归属进程内验证（跨主机 token 等 buyer）。
    - group: act
      "no": "8"
      name: P23 定位查询
      edge: P23 · GroundingSeam（经 P11 GroundingView）
      edge_ref: P23
      dir: Kernel → World Model
      st: keep
      fields:
        - name: ResolveCurrent
          type: 模式
          desc: TargetDescriptor → CurrentCandidateSetResult（Unique/None/Multiple/Unavailable）
          mark: 必
        - name: ResolveContinuity
          type: 模式
          desc: ContinuityResolutionOutcome + DemandHandle（幂等键）
          mark: 必
      note: 单缝双模；投影相对事实（NoCandidate ≠ KnownAbsent ≠ Ended）。
    - group: act
      "no": "9"
      name: P9 候选绑定
      edge: "P9 · Candidate Binding"
      edge_ref: P9
      dir: Grounding Provider → EB
      st: keep
      fields:
        - name: TargetSubject / TargetValue
          type: string
          desc: 字符串通道（UI 工厂置 null! 压制）
          mark: 必
        - name: SourceRevisionId
          type: string
          desc: 候选依据版本
          mark: 必
        - name: IsAmbiguous
          type: bool = false
          desc: 歧义声明
          mark: 选
        - name: UiTarget
          type: record?
          desc: UI 通道：OccurrenceId + SourceRevisionId + LogicalItemId?（仅溯源）——UI 通道必带
          mark: 选
      note: 候选 ≠ canonical（不变量 24）。
    - group: act
      "no": "10"
      name: P10 正式绑定
      edge: "P10 · Canonical Binding"
      edge_ref: P10
      dir: EB → Assurance
      st: fix
      fixTag: S4
      fix_ref: PROTOCOL-FIX-004
      fix: S4：撕掉 locator 三字段；P14 成为 locator 唯一来源。
      fields:
        - name: BindingId / IntentId
          type: string
          desc: 绑定身份 + 意图关联
          mark: 必
        - name: EffectClass
          type: string
          desc: 效果语义
          mark: 必
        - name: TargetSubject / TargetValue
          type: string
          desc: 沿载（UI 通道为 occurrence id 字符串）
          mark: 必
        - name: RevisionId / RevisionNumber
          type: anchor
          desc: 钉死世界观版本（currency 派生失效）
          mark: 必
        - name: TargetOccurrenceId
          type: string?
          desc: UI 通道恒绑 occurrence
          mark: 选
        - name: OwningContainerId / LogicalItemId
          type: string?
          desc: 容器与连续性溯源
          mark: 选
        - name: TargetLocator / TargetNative / TargetSpace
          type: "✖ S4 移除"
          desc: 投递材料不该进绑定载荷——安检从不读；Core 投影改从 DeliveryTarget 取（消费面已查清：全仓两处）
          mark: —
    - group: act
      "no": "11"
      name: P13 裁决
      edge: "P13 · Assurance Judgment"
      edge_ref: P13
      dir: Assurance → Gate
      st: keep
      fields:
        - name: IntentId + BindingId + RevisionId
          type: 三元组
          desc: correlation key，任一变即重裁
          mark: 必
        - name: IsAdmissible
          type: bool
          desc: 可否做
          mark: 必
        - name: Checks
          type: list
          desc: 逐项留痕
          mark: 必
        - name: RejectionReason
          type: string?
          desc: 拒绝首因
          mark: 选
        - name: Freshness
          type: FreshnessJudgment
          desc: 消费相对充分性三态——拒绝 ≠ 绑定失效
          mark: 必
      note: Gate 只执法不重判；拒绝可观察有 reason。
    - group: act
      "no": "12"
      name: 闸门 + 台账
      edge: Effect Gate + Reliable Execution Source
      dir: EB 内部
      st: keep
      fields:
        - name: GateDecision
          type: (Allowed, Reason)
          desc: 只执行或拒绝既有授权
          mark: 必
        - name: journal 登记
          type: append-only
          desc: binding/judgment/请求/执行端/准入摘要——先登记后执行，提交失败零 driver 调用
          mark: 系
        - name: 未决发现
          type: Pending Attempt
          desc: 无 ID 发现未决；LinkRetry / LinkCompensation 关联
          mark: 系
      note: 崩溃后可对账，绝不盲补发。
    - group: act
      "no": "13"
      name: P14 派工单
      edge: "P14 · Dispatch Request"
      edge_ref: P14
      dir: EB → driver
      st: keep
      fields:
        - name: DeliveryTarget
          type: record
          desc: OccurrenceReference（仅溯源，永不参与执行）+ Spatial? + Native? + Space?
          mark: 必
        - name: EffectClass
          type: string
          desc: 来自绑定
          mark: 必
        - name: Parameters
          type: string?
          desc: 当前沿载字符串；typed family = 未来 buyer
          mark: 选
        - name: RevisionId
          type: anchor
          desc: 绑定依据版本
          mark: 必
      note: S4 之后这里是 locator 的唯一来源；driver 固定消费自身支持集，不挑选不 fallback。
    - group: act
      "no": "14"
      name: P15 投递结果
      edge: "P15 · Dispatch Result"
      edge_ref: P15
      dir: driver → EB
      st: keep
      fields:
        - name: Outcome
          type: enum 三态
          desc: DeliveryCompleted | DeliveryFailed | UnknownOutcome（认知状态，非成因）
          mark: 必
        - name: Report
          type: string
          desc: provider 报告（描述性 provenance）
          mark: 必
        - name: CompletedAt
          type: datetime
          desc: 下游确认时间
          mark: 必
        - name: Reason
          type: string? = null
          desc: 成因诊断（不锁词汇）：timeout-killed / device-offline / …
          mark: 选
      note: UnknownOutcome 唯一合法后继 = 重新观察，永不盲补发。
    - group: act
      "no": "15"
      name: 回执回流
      edge: P2 · AttemptReport
      edge_ref: P2
      dir: EB → Evidence Ledger
      st: fix
      fixTag: S1
      fix_ref: PROTOCOL-FIX-001
      fix: S1：回流侧 origin 与 P2/P3 同源闭合。
      fields:
        - name: ReceiptId / IntentId / BindingId
          type: string
          desc: attempt 关联
          mark: 必
        - name: TargetSubject / RevisionId / RevisionNumber
          type: anchor
          desc: 目标与版本留痕
          mark: 必
        - name: Outcome / Report / DispatchedAt
          type: 同 P15
          desc: ""
          mark: 必
        - name: Reason
          type: string? = null
          desc: 成因诊断
          mark: 选
        - name: Origin
          type: "＋ S1 新增"
          desc: 回流侧统一携带：经 receipt↔observation 精确关联推导为 PostActionSelf；AttemptReport 永不满足 MaterialEffect（不变量不变）
          mark: 必
    # ---- 验证屏障 ----
    - group: verify
      "no": "16"
      name: 验证输入
      edge: Kernel 编排 → Assurance
      dir: Kernel → Assurance
      st: fix
      fixTag: S2
      fix_ref: PROTOCOL-FIX-002
      fix: S2：期望载荷独立成字段（ADR-0049）；新增 effect 类型不再硬编码期望。
      fields:
        - name: TargetSpec
          type: record
          desc: 目标规格（含状态断言）
          mark: 必
        - name: Slice
          type: record
          desc: 当前 scoped 只读投影
          mark: 必
        - name: ProcessedObservations
          type: list<KernelResult>
          desc: 本轮 P2/P3 处理结果
          mark: 必
        - name: TargetDisappearedAfterRouteChange
          type: bool = false
          desc: 特设
          mark: 选
        - name: PriorRoute / CurrentRoute / ScrollContentChanged
          type: "✖ S2 迁移"
          desc: 滚动期望三硬编码布尔 → 迁移为 RouteStable ∧ ContentChanged 实例后删除
          mark: —
        - name: ExpectedEffect
          type: "＋ S2 新增"
          desc: 两族封闭谓词：StateBecomes(subject,value) 状态型；ContentChanged / RouteStable 变化型——验证的显式对照物；修复后无期望载荷 = RED
          mark: 必
    - group: verify
      "no": "17"
      name: MaterialEffect 判定
      edge: Assurance 内部（S5 立法点）
      dir: Assurance
      st: fix
      fixTag: S5
      fix_ref: PROTOCOL-FIX-001
      fix: S5：明文规则 + 锚定测试（仅身份连续、无谓词对照的验证 = 拒绝）。
      fields:
        - name: 判定输入
          type: Evidence + ExpectedEffect + Origin
          desc: （S1+S2 交付后齐备）
          mark: 必
        - name: 立法
          type: "＋ S5 新增"
          desc: 受 P22 prior 影响的关联连续性不得作为 MaterialEffect 唯一依据——对照物必须是显式期望谓词 + origin 输入
          mark: 系
    # ---- 终局 ----
    - group: terminal
      "no": "18"
      name: P7 义务定义
      edge: "P7 · Obligation Definition View"
      edge_ref: P7
      dir: Run Model → Assurance
      st: keep
      fields:
        - name: 义务定义
          type: identity/kind/subject/required value/mandatory
          desc: 只表达"要证明什么"；满足状态是 Assurance 的独立投影
          mark: 必
      note: 定义/状态分离已冻结（ADR-0047）。
    - group: terminal
      "no": "19"
      name: P16 终局证明
      edge: "P16 · Outcome Proof"
      edge_ref: P16
      dir: Assurance → Run Model
      st: keep
      fields:
        - name: Classification
          type: 四分类
          desc: Completion | Failure | SafeStop | Escalation（证据不足 = 无 proof，不伪装）
          mark: 必
        - name: obligation statuses + evidence refs
          type: list
          desc: 支撑清单
          mark: 必
        - name: unresolved uncertainty + reason
          type: ""
          desc: 诚实边界
          mark: 必
      note: 预算耗尽终局在 S3 生效后到的是 policy 铁顶（非静默缺省）。
    - group: terminal
      "no": "20"
      name: P17 终局记录
      edge: "P17 · Terminal Outcome State"
      edge_ref: P17
      dir: Run Model → Kernel
      st: keep
      fields:
        - name: OutcomeState
          type: 快照
          desc: exact-prior single-winner；至多一次；terminal 后冻结不可复活
          mark: 必
      note: ""
    - group: terminal
      "no": "21"
      name: P18 交卷信封
      edge: "P18 · Runtime Outcome"
      edge_ref: P18
      dir: Kernel → UniAgent
      st: keep
      fields:
        - name: RunId / OutcomeProofId
          type: string
          desc: 运行与证明引用
          mark: 必
        - name: Classification
          type: 四分类
          desc: ""
          mark: 必
        - name: Obligations
          type: list<status>
          desc: 义务结算
          mark: 必
        - name: Basis/Effect/Situation EvidenceIds
          type: set
          desc: 证据引用三层
          mark: 必
        - name: UnresolvedUncertainty + Reason
          type: ""
          desc: 解释性元数据（productSessionId 🔵 走 ⑨ 轨道）
          mark: 必
      note: exactly once；发出后投递闸门永久关闭。
    - group: terminal
      "no": "22"
      name: P19 评价
      edge: "P19 · Goal Evaluation"
      edge_ref: P19
      dir: UniAgent → user/session
      st: keep
      fields:
        - name: EvaluationId
          type: 确定性派生
          desc: Goal+Run+Proof 幂等
          mark: 必
        - name: Satisfaction × Disposition
          type: 枚举
          desc: Satisfied/Partial/Unsatisfied × Final/NeedsFollowUp；Undetermined ⇒ NeedsFollowUp
          mark: 必
      note: 只评不改——不回写任何执行事实。
