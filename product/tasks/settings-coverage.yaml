# Settings menu coverage traversal profile (AGT-005).
configVersion: "1"
session:
  taskTitle: 遍历设置菜单覆盖测试
  workspace: UniClaw_Product_Tasks
  workspaceReuse: true
  autoCloseTurn: false
bounds:
  maxSteps: 96
  maxConsultRounds: 112
  # ADR-0052：Runtime主动复核；20%建议以初始额度为基数，正常推进可逐笔续授。
  # 若任务另有真实授权总上限，显式配置authorizedTotalSteps/authorizedTotalConsultRounds。
  goalDirectedContinuationEnabled: true
  renewalThresholdSteps: 20
  renewalThresholdRounds: 24
  maxScrolls: 12
  maxConsecutiveFailures: 4
  maxDirectiveRetries: 2
  # AGT-019 M5（Q6）：no-progress 双零窗口（新发现+新完成验证同零）。
  # 新策略中计数只触发事实注入与加强复核，不能单独作目标失败判断。
  stagnationInjectConsults: 3
  stagnationStopConsults: 5
coverage:
  rootPage: true
  firstLevelMode: all-visible
  scrollDiscoveredEntries: 1
  secondLevelPages: 8
  backNavigation: true
  repeatedEntries: 1
targetPages:
  - Network & internet
  - Connected devices
  - Apps
  - Notifications
  - Battery
  - Storage
  - Sound & vibration
termination:
  onCoverageComplete: true
  onMaxSteps: true
  onMaxScrolls: true
  onConsecutiveFailures: true
evidence:
  persistScreenshots: true
  persistHierarchies: true
rootRoute: android.settings|rk1:Settings|src=homepage_title|up=0
scrollContainerDescriptor: com.android.settings:id/main_content_scrollable_container
backDescriptor: Navigate up
# 由真实根页 perception 观察建立动态安全入口前沿；静态 targetPages
# 继续作为兼容 seed，未知危险/开关/框架控件由 Host policy 跳过并留痕。
dynamicRootEntries:
  enabled: true
  mode: all-visible
  excludedDescriptors:
    - Search settings
dynamicNestedEntries:
  enabled: true
  maxDepth: 1
  maxEntriesPerPage: 1
# AGT-017：Slow 感知 live 启用（所有者指令）。text 档走会话模型；
# 有界等待 15s（周期不阻塞超此界）；每 run 预算 6 次；visual 暂不启用。
slow:
  enabled: true
  boundedWaitMs: 15000
  maxRequestsPerRun: 6
  visualEnabled: false
  popupConsecutiveCycles: 2
# AGT-019 M4（Q5）：弹窗处置 policy（任务型白名单）。遍历型任务无
# confirm 权限；安全词 {cancel, dismiss} + 返回键直接点；白名单外
# confirm 唯一出路 = 暂停+重授权（不变量 47）。禁手清单以 policy 工件
# 为准（PRF-004 面），与 yaml 显式 deny 并集。
popup:
  dispositionPolicy: product/policy/android-settings-popup-disposition.json
actionPolicy:
  required: true
  # PRF-005：canonical 副本升格产品声明面（product/AGENTS.md；ADR-0041）。
  path: product/policy/android-settings-forbidden-actions.json

# CAP-012 D1/D3：语言检查任务启用（英文 UI 判定；Internet 页是 SSID 列表——
# 任意语言用户串，按所有者裁决设为忽略区）。
languageInspection:
  required: true
  capabilityId: runtime.language-inspector
  expectedLanguage: en
  ignoreRoutes:
    - "rk1:Internet|src=title|up=1"
