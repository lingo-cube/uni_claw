name: Simulation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  simulation-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run simulation tests
      run: |
        # Run basic unit tests
        pytest tests/simulation/test_page_analyzer.py -v
        pytest tests/simulation/test_mock_vision.py -v
        pytest tests/simulation/test_assertions.py -v

    - name: Generate coverage report
      run: |
        pytest tests/simulation/ --cov=src/simulation --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let commentBody = '## Simulation Test Results\n\n';
          commentBody += `**Python Version**: ${{ matrix.python-version }}\n\n`;
          commentBody += '✅ Basic simulation tests completed\n';
          commentBody += '\nCheck the Actions log for detailed results.';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          });

  integration-tests:
    runs-on: ubuntu-latest
    needs: simulation-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run integration tests
      run: |
        python -c "from tests.simulation.helpers import SimulationTestRunner; print('Integration test import successful')"

    - name: Test CLI tool
      run: |
        python cli/simtest.py --help

    - name: Test template fixture
      run: |
        python -c "import json; f=open('tests/simulation/fixtures/template/test_case.json'); data=json.load(f); print('Template fixture valid'); f.close()"